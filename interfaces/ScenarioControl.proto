syntax = "proto3";

package keelson.interfaces.scenario_control;

import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// RPC interface for the world-level lifecycle of a *scenario*: the clock
// that every simulated entity in a run shares.
//
// This is the companion SimulationControl anticipated. That interface is
// deliberately per-entity and real-time only, and says so:
//
//     "Faster- or slower-than-real-time scenario control is deliberately
//      out of scope; if it is ever added it arrives as a separate
//      world-level interface on a scenario entity, leaving this
//      per-entity lifecycle contract unchanged."
//
// This is that interface, and it does leave SimulationControl unchanged.
// The two compose rather than overlap:
//
//   SimulationControl  one entity's participation — is boat1 running?
//   ScenarioControl    the world's clock — what tick is it, how fast is
//                      time passing, and can we step it by hand?
//
// Scope is per-scenario, served by ONE responder under a scenario entity
// (e.g. {base}/@v0/scenario/@rpc/scenario_control/v1/step/{responder}).
// A run has exactly one clock authority; if two responders answer here,
// the run has two clocks and the recording is not evidence of anything.
//
// Time model. The scenario authority owns a fixed-step clock. Every state
// and observation in a run carries the tick it belongs to, and simulated
// logic never reads the wall clock. `rate` scales how tick time maps onto
// wall time:
//
//     rate = 1.0   real time
//     rate = 5.0   five times faster than real time
//     rate = 0.1   slow motion, for inspecting a manoeuvre
//     rate = 0.0   unpaced — advance as fast as participants allow
//                  (fast-time; high-bandwidth sensors are normally
//                  disabled by the scenario in this regime)
//
// A negative rate has no meaning and replies OUT_OF_RANGE. Running time
// backwards is not a rate; it is replay, which is ReplayControl's job.
//
// Run identity. A run id is minted when a run *begins* — `start` from
// STOPPED, or `restore` in scenario_checkpoint/v1 — and never by `load`,
// which comes to rest in STOPPED with no run in progress. It is observed
// on keelson.ScenarioStatus.run_id, which is why LoadResponse does not
// carry one: there is nothing yet to name. This keeps run ids meaning one
// thing across both interfaces, and keeps load -> start -> reset -> start
// from producing two runs from tick 0 that share an id — a recording is
// only evidence if the runs in it are separable.
//
// `step` is the deterministic path and the reason this interface exists
// for testing as much as for operation: from PAUSED, advance exactly N
// ticks, publish everything those ticks produce, and stop again. A test
// or an instructor station can therefore drive a run reproducibly instead
// of racing it.
//
// State machine (broadcast continuously as the keelson.ScenarioStatus
// pub/sub payload — clients observe state by subscribing, not by polling
// an RPC, exactly as with SimulationStatus):
//
//     NO_SCENARIO ──load──► STOPPED ──start──► RUNNING ──pause──► PAUSED
//                              ▲                  │                 │
//                              │                  │      ┌──step────┤
//                              └──── stop/reset ◄─┴──────┴──start───┘
//
//   list_scenarios : any          -> unchanged
//              what the responder is willing to load, so a caller need not
//              already know an id. Read-only and legal in any state.
//   load     : any                -> [LOADING] -> STOPPED
//              resolve and validate a scenario. **Transactional**: the
//              responder resolves and validates before it disturbs
//              anything, and LOADING is entered only once the load has
//              committed. A load that fails validation therefore never
//              leaves the state it was called in — a typo'd id cannot kill
//              a running exercise, which no caller can want and no server
//              should be required to do. On failure the reply carries the
//              reason: from NO_SCENARIO the state stays NO_SCENARIO; from
//              RUNNING or PAUSED the previously loaded scenario keeps
//              running untouched.
//              A load that succeeds *does* terminate a running exercise.
//              The run ends, the new scenario is loaded, and the state
//              comes to rest in STOPPED at tick 0 — so the STOPPED box in
//              the diagram above is reachable by load from any state, not
//              only from NO_SCENARIO.
//   start    : STOPPED | PAUSED   -> RUNNING
//              begin, or resume, advancing the clock at `rate`.
//   pause    : RUNNING            -> PAUSED
//              hold the clock. Entities stop producing observations —
//              a gap in the data, never frozen values republished.
//   step     : PAUSED             -> PAUSED
//              advance exactly N ticks and hold again.
//   reset    : STOPPED | PAUSED   -> STOPPED
//              return to tick 0 with the loaded scenario intact. The run
//              ends here; the next start begins a new one, with a new run
//              id, so two attempts at the same scenario are separable in
//              one recording.
//   stop     : any (with scenario)-> STOPPED
//              halt and reset; the scenario stays loaded, and as with
//              reset the run ends.
//   set_rate : any                -> unchanged
//              retune the clock; legal while RUNNING.
//
// Calling an RPC in a state where it has no meaning (e.g. step while
// RUNNING) replies with ErrorResponse{code = INVALID_STATE}. Calling one
// with no scenario loaded replies INVALID_STATE, not NOT_FOUND — the
// request was legal, the world was not ready for it.
//
// Entity lifecycle — spawning and despawning scenario-owned actors such
// as background traffic — is deliberately absent. It is a separate
// concern with its own failure modes and belongs in its own interface;
// test vessels stay statically configured so downstream connectors can
// bind to known entity_ids ahead of time, exactly as SimulationControl
// requires.
//
// NOTE: this interface defines the contract only. A connector must still
// implement the server side; until then, no service is guaranteed to be
// reachable.

// One scenario the responder is willing to be asked about. Deliberately
// thin: the fields are the ones an operator needs to *choose* between two
// scenarios, not a description of what a scenario is. What a scenario is
// varies by simulator, and pinning that here would bind every
// implementation to one — the same reason LoadRequest.scenario is opaque.
message ScenarioInfo {
  // Exactly what `load` takes. A listing whose ids are not loadable ids is
  // a listing a picker cannot act on.
  string scenario_id = 1;

  // One line, from the document. Empty if it carries none.
  string description = 2;

  // Content hash of the scenario as the responder reads it — the same hash
  // ScenarioStatus broadcasts, so a picker can tell which of these is the
  // running one, and two responders offering the same id can be compared.
  string scenario_hash = 3;

  // Enough to tell two scenarios apart at a glance. All three carry
  // explicit presence, because absent and zero are different answers and a
  // picker that cannot tell them apart will render a guess as a fact.

  // How many vessels the scenario declares. Absent when the responder did
  // not count; present 0 is a real answer — an environment-only scenario.
  optional uint32 vessel_count = 4;

  // The scenario's declared length in ticks, present only when it declares
  // an end. Absent means there is no declared end to report: the scenario
  // is open-ended, or the responder could not determine one. This listing
  // deliberately does not distinguish those two — a picker renders both the
  // same way, and a responder that guessed between them would be inventing
  // the distinction rather than reporting it.
  optional uint64 duration_ticks = 5;

  // The fixed step each tick represents. A Duration rather than a scalar of
  // milliseconds so it is directly comparable with
  // keelson.ScenarioStatus.step_size — a picker holding a listed scenario
  // against the running one should not have to convert between encodings of
  // the same quantity. Absent when the responder does not know.
  google.protobuf.Duration step_size = 6;

  // Whether the responder would load this scenario if asked.
  //
  // An enum with a countable unknown rather than a bool, because the zero
  // value is what a partially-populated row reports and the affirmative has
  // to be the safe one: LOADABILITY_UNKNOWN means the responder expressed no
  // opinion, and a picker must offer such a row and let `load` answer. A
  // bool would make every row a simpler responder builds read as "would
  // refuse", greying out a whole library nobody has anything against.
  //
  // NOT_LOADABLE rows stay on the wire rather than being filtered out,
  // because both alternatives are worse. Omitting them hides files the
  // operator can see in the library and leaves them asking why one is
  // missing; listing them as loadable is a lie the picker only discovers by
  // trying. A simulator whose scenario language is still growing has these
  // constantly: the document parses, and names a construct this build
  // cannot elaborate.
  enum Loadability {
    LOADABILITY_UNKNOWN = 0;
    LOADABLE = 1;
    NOT_LOADABLE = 2;
  }
  Loadability loadability = 7;

  // Why, in the words the failed load would have used. Set when loadability
  // is NOT_LOADABLE; it may also explain a LOADABILITY_UNKNOWN. It MUST be
  // empty when loadability is LOADABLE — a caller must never have to decide
  // whether text here is a warning about a scenario it can load.
  string reason = 8;
}

message ListScenariosRequest {
  // Optional; the responder decides what it means (an id prefix, a glob).
  // No filter lists everything the responder is willing to list. Same
  // contract as ListCheckpointsRequest.pattern and ListFilesRequest.pattern.
  string pattern = 1;
}

message ListScenariosResponse {
  // Where the responder is listing from, for the reason its two siblings
  // carry it: an operator choosing between two scenarios with the same id
  // needs to know whether they came from the same place.
  string base_directory = 1;

  // Ordered by scenario_id, so a listing read twice reads the same way.
  repeated ScenarioInfo scenarios = 2;

  // True when the responder capped the listing. On the wire because a
  // listing that quietly stopped short reads as "that is all of them", and
  // an operator would go looking for a scenario that is in fact there.
  bool truncated = 3;
}

message LoadRequest {
  // Identifier of the scenario to load, as the responder understands it —
  // an id within a configured library, or a path it can resolve. Left
  // deliberately opaque: what a scenario *is* varies by simulator, and
  // pinning a schema here would bind every implementation to one.
  string scenario = 1;
}

message StepRequest {
  // Number of fixed steps to advance. Zero is a no-op that still replies
  // OK, so a caller can poll the resulting tick without special-casing.
  uint32 ticks = 1;
}

message SetRateRequest {
  // Wall-clock scaling of simulated time. 1.0 is real time, 0.0 is
  // unpaced; negative replies OUT_OF_RANGE.
  double rate = 1;
}

// One response message per RPC. Each is dedicated to its method so an
// individual command can grow a return field later without a breaking
// type change and without that field bleeding onto the other commands.
message StartResponse {}
message PauseResponse {}
message StopResponse {}
message ResetResponse {}
message SetRateResponse {}

message LoadResponse {
  // What was actually loaded, resolved. `scenario` in the request is
  // whatever the caller typed; these are the responder's answer to it.
  //
  // Returned rather than left to the status broadcast for the reason
  // StepResponse.tick gives below: a caller should not have to race a 1 Hz
  // status sample to learn the result of its own call. It also makes an
  // ambiguous id visible — a caller that asked for "harbor" and got back a
  // hash it did not expect can say so.
  //
  // No run id here; see "Run identity" above. A load lands in STOPPED, where
  // no run has begun.
  string scenario_id = 1;
  string scenario_hash = 2;
}

message StepResponse {
  // Where the clock came to rest. Returned rather than left to the status
  // broadcast because the caller of a deterministic step needs to know
  // which tick it just produced, without racing a 1 Hz status sample.
  uint64 tick = 1;
  google.protobuf.Timestamp simulation_time = 2;
}

service ScenarioControl {
  rpc list_scenarios(ListScenariosRequest) returns (ListScenariosResponse);
  rpc load(LoadRequest) returns (LoadResponse);

  rpc start(google.protobuf.Empty) returns (StartResponse);
  rpc pause(google.protobuf.Empty) returns (PauseResponse);
  rpc stop(google.protobuf.Empty)  returns (StopResponse);
  rpc reset(google.protobuf.Empty) returns (ResetResponse);

  rpc step(StepRequest) returns (StepResponse);
  rpc set_rate(SetRateRequest) returns (SetRateResponse);
}

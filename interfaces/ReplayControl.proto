syntax = "proto3";

package keelson.interfaces.replay_control;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// RPC interface for controlling a replay instance from an external application:
// list files, load, play/pause/stop, seek, change speed, toggle looping. The
// contract is recording-format-agnostic — any connector that replays recorded,
// timestamped messages onto the bus (mcap-replay today; a klog replayer could
// be another) can serve it. Playback state itself is not returned by an RPC —
// it is broadcast continuously as the keelson.ReplayStatus pub/sub payload, so
// clients monitor progress by subscribing rather than polling.
//
// NOTE: this interface defines the contract only. A connector (e.g. mcap-replay)
// must still implement the server side; until then, no service is guaranteed to
// be reachable.

// -----------------------------------------------------------------------------
// File listing
// -----------------------------------------------------------------------------

message FileInfo {
  string path = 1;
  uint64 size_bytes = 2;
  uint64 message_count = 3;
  uint32 channel_count = 4;
  google.protobuf.Timestamp start_time = 5;
  google.protobuf.Timestamp end_time = 6;
  repeated string channel_names = 7;
}

message ListFilesRequest {
  // Optional glob pattern; the server picks a sensible default for its format
  // (the mcap-replay connector defaults to "*.mcap").
  string pattern = 1;
}

message ListFilesResponse {
  // Base directory the files are listed from.
  string base_directory = 1;
  repeated FileInfo files = 2;
}

// -----------------------------------------------------------------------------
// File description
// -----------------------------------------------------------------------------

message DescribeFileRequest {
  // Path relative to the replayer's base directory, as in load_file. The file
  // need not be loaded — a client can inspect a recording before playing it.
  string path = 1;
}

// One channel (topic) in the file, and when it spoke.
message ChannelInfo {
  string topic = 1;
  // The channel's schema name as recorded, e.g. "keelson.TimestampedFloat".
  string schema_name = 2;
  // The channel's message encoding as recorded, e.g. "protobuf".
  string message_encoding = 3;
  uint64 message_count = 4;
  // log_time of the channel's first and last message. Unset when the channel
  // recorded no messages. Exact, not the bounds of the chunks it appears in.
  google.protobuf.Timestamp first_time = 5;
  google.protobuf.Timestamp last_time = 6;
}

message DescribeFileResponse {
  FileInfo file = 1;
  repeated ChannelInfo channels = 2;
  // True when the file carried no summary or no chunk indexes, so the replayer
  // had to read it end to end. The figures are still exact; the call was just
  // proportional to the file's size rather than to its number of chunks.
  bool from_scan = 3;
}

// -----------------------------------------------------------------------------
// Control requests
// -----------------------------------------------------------------------------

message LoadFileRequest {
  // One recording, relative to the replayer's base directory.
  string path = 1;
  // Several recordings, played as ONE: their messages are interleaved by log time, so the timeline
  // is the union of their spans and seek, range and loop apply across all of them. When non-empty
  // it wins and `path` is ignored. A client sets `path` to the first entry as well, so a replayer
  // that predates this field loads that one file rather than none -- and must check
  // DaemonInfo.multi_file_load before offering a merge, because such a replayer ignores the rest
  // without saying so.
  repeated string paths = 2;
}

message SeekRequest {
  // Target playhead timestamp. Must fall within the ACTIVE RANGE when `set_range` has set one, and
  // within the loaded file's window otherwise; outside it the reply is OUT_OF_RANGE. A seek is not
  // clamped into the range, for the reason an inverted range is not swapped: a client that read its
  // own position back and found it somewhere else would have nothing telling it so.
  google.protobuf.Timestamp target = 1;
}

message SetSpeedRequest {
  // Playback speed multiplier; expected range [0.25, 20.0]. At high speeds a
  // recording heavy with images or point clouds is published as fast as the
  // replayer can manage and lags wall time; no message is dropped.
  float speed = 1;
}

message SetLoopRequest {
  bool loop = 1;
}

// Bound playback to a span of the loaded file.
//
// The operation a reviewer wants constantly: an incident occupies twenty seconds of a two-hour
// recording, and you want those twenty seconds -- repeatedly, if `set_loop` is on. Composing it from
// `seek` does not work well, because a client can only notice the end has passed AFTER it has
// published past it; see RISE-Maritime/keelson#198.
//
// BOTH FIELDS UNSET CLEARS THE RANGE and returns playback to the whole file. Clearing has to be
// expressible, and it is: these are MESSAGE fields, so proto3 gives them explicit presence and a
// server distinguishes unset from a zero Timestamp with `HasField`. That distinction is load-bearing
// rather than pedantic -- epoch 0 is a legitimate log time, and a recording from a device with no
// clock really does start there, so a zero value could not have doubled as "none".
message SetRangeRequest {
  // First message replayed. Unset means the file's start.
  google.protobuf.Timestamp start = 1;
  // Playback stops or loops on reaching this. Unset means the file's end.
  //
  // Inclusive: an operator who puts the out-point ON a message means to hear that message. Only
  // `end` strictly BEFORE `start` is refused -- `end` equal to `start` is a one-message span.
  google.protobuf.Timestamp end = 2;
}

// Generic acknowledgement for control commands.
message ReplaySuccessResponse {}

// -----------------------------------------------------------------------------
// Service
// -----------------------------------------------------------------------------

service ReplayControl {
  rpc list_files(ListFilesRequest) returns (ListFilesResponse);
  // Per-channel message counts and first/last message times for one file.
  rpc describe_file(DescribeFileRequest) returns (DescribeFileResponse);
  rpc load_file(LoadFileRequest) returns (ReplaySuccessResponse);

  rpc play(google.protobuf.Empty) returns (ReplaySuccessResponse);
  rpc pause(google.protobuf.Empty) returns (ReplaySuccessResponse);
  rpc stop(google.protobuf.Empty) returns (ReplaySuccessResponse);

  rpc seek(SeekRequest) returns (ReplaySuccessResponse);
  rpc set_speed(SetSpeedRequest) returns (ReplaySuccessResponse);
  rpc set_loop(SetLoopRequest) returns (ReplaySuccessResponse);
  rpc set_range(SetRangeRequest) returns (ReplaySuccessResponse);
}

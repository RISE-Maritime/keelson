syntax = "proto3";

package keelson.interfaces.conn;

import "Attestation.proto";

// conn/v1 — claiming and releasing the conn, and arming the vessel.
//
// Upstreamed from coxswain (github.com/freol35241/coxswain, the conn RPCs of
// crates/coxswain-keelson at 39690a3), whose design keelson adopts — see
// docs/decisions/0001-coxswain-conn.md and protocols/conn.yaml. Semantics,
// messages and result codes are coxswain's. The procedure names drop
// coxswain's `conn_` / `vehicle_` prefixes, which the `conn/v1` interface chunk
// now carries:
//
//   coxswain           conn/v1
//   conn_register   -> register
//   conn_request    -> request
//   conn_release    -> release
//   vehicle_arm     -> arm
//   vehicle_disarm  -> disarm
//
// The responder is the vessel's supervisor — the only arbiter of the conn.
//
// Every procedure takes a ConnRequest and replies a ConnReply on the ok channel,
// including refusals: a refused request is a successful call whose `result`
// says why. The error channel (keelson.interfaces.ErrorResponse) is for
// transport-level failures only — no responder, an unparseable request.
//
// Rules the service definition cannot state:
//
//   1. `request` grants when the conn is unheld, or when the requester's
//      priority is STRICTLY greater than the holder's. Equal or lower gets
//      CONN_HELD. Priorities are declared per vessel in the manifest; an
//      unlisted claimant has priority 0. Preemption is unilateral: the former
//      holder is not asked, and learns of it from `conn_state`.
//   2. A request, granted or not, and a registration both count as the
//      claimant's heartbeat, as does every setpoint it publishes.
//   3. `release`, `arm` and `disarm` are holder-only (NOT_HOLDER otherwise).
//      Releasing while armed latches ClaimantLost: the vessel keeps station.
//   4. `arm` is refused while the supervisor's failsafe conditions hold:
//      estimator fault (REFUSED_ESTIMATOR), position degraded
//      (REFUSED_POSITION), voltage below the low threshold (REFUSED_VOLTAGE),
//      or a stale power report (REFUSED_POWER_STALE).
//   5. A claimant the vessel's manifest marks as attesting must carry a valid
//      `attestation` (keelson.Attestation, messages/payloads/Attestation.proto)
//      on every call, or the call is refused REFUSED_ATTESTATION. Where the
//      manifest also requires a role to operate that claimant — a shore
//      console that only an operator with NAVIGATIONAL_COMMAND may drive — a
//      valid claim that does not grant it is refused REFUSED_ROLE.
//   6. `arm` is refused REFUSED_SAFETY while `safety_state`
//      (protocols/emergency_request.yaml) is not CLEAR, has not been heard
//      within its TTL, or reads UNSPECIFIED. The same condition is the top row
//      of the supervisor's failsafe matrix: idle and a forced disarm, whoever
//      holds the conn.

message ConnRequest {
  // The claimant's id. Ids are u16 on the vessel side; a value above 65535 is
  // refused.
  uint32 claimant_id = 1;

  // Who is really asking: a signed claim from the shore authority service that
  // authenticated the operator, bound to this exact request (carry-over C2 of
  // docs/decisions/0001-coxswain-conn.md). Without it the claimant id is
  // self-asserted. Required for every claimant the manifest marks as
  // attesting; ignored, and recorded when present, for the others.
  optional keelson.Attestation attestation = 2;
}

message ConnReply {
  enum Result {
    OK = 0;
    ALREADY_REGISTERED = 1;
    REGISTRY_FULL = 2;
    CONN_HELD = 3;
    NOT_HOLDER = 4;
    UNREGISTERED = 5;
    REFUSED_ESTIMATOR = 6;
    REFUSED_VOLTAGE = 7;
    REFUSED_POSITION = 8;
    ERROR = 9;
    REFUSED_POWER_STALE = 10;
    // Rule 5: an attestation required and missing, or one that does not
    // verify.
    REFUSED_ATTESTATION = 11;
    // Rule 6: safety_state is not CLEAR — a shore STOP, a physical stop, the
    // local lockout, or no safety_state heard.
    REFUSED_SAFETY = 12;
    // Rule 5: the attestation verifies but does not grant the role the
    // manifest requires to operate this claimant.
    REFUSED_ROLE = 13;
  }
  Result result = 1;
}

service Conn {
  // Add the claimant to the vessel's registry. Counts as a heartbeat.
  rpc register(ConnRequest) returns (ConnReply);

  // Ask for the conn. See rules 1 and 2 above.
  rpc request(ConnRequest) returns (ConnReply);

  // Give the conn back. Holder only.
  rpc release(ConnRequest) returns (ConnReply);

  // Arm the vessel. Holder only; refused under a failsafe condition.
  rpc arm(ConnRequest) returns (ConnReply);

  // Disarm the vessel. Holder only.
  rpc disarm(ConnRequest) returns (ConnReply);
}

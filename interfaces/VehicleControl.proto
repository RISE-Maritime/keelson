syntax = "proto3";

package keelson.interfaces.vehicle_control;

import "google/protobuf/empty.proto";

// Configuration interface for the live, high-rate "drive the vehicle"
// data path — the control-axis layer that turns desired actuator
// setpoints (steering, throttle, …) into actual hardware output. Same
// architectural shape as the file-driven sensor injection: this interface
// configures *which existing Keelson subjects the connector should
// subscribe to* per control axis, then the connector forwards each
// arriving sample to the underlying actuation transport (MAVLink RC
// override for mavlink2keelson; other actuation connectors implementing
// this interface have their own framing).
//
// The data itself flows on existing TimestampedFloat subjects. Sources
// can be manual (joystick_x_pct, joystick_y_pct, dpad_*_pct,
// wheel_position_pct, lever_position_pct, joystick_lt_pct,
// joystick_rt_pct — see subjects.yaml), autonomous (a guidance
// processor publishing desired setpoints), or any mix — the interface
// is indifferent. The connector does not invent a new payload type
// for actuator setpoints.

message ControlAxis {
  // Entity to subscribe under. Empty string => connector's own
  // --entity-id (the typical case: a companion-board joystick driver
  // publishing under the same vehicle's namespace).
  string entity_id = 1;

  // Keelson subject to subscribe to. Must be a TimestampedFloat-valued
  // subject. Common picks: joystick_x_pct (steering), joystick_y_pct
  // (throttle), wheel_position_pct (helm wheel), lever_position_pct
  // (engine telegraph), joystick_rt_pct (right-trigger as accelerator).
  string subject = 2;

  // Source-id glob pattern within the entity.
  string source_id = 3;

  // Source range hint. False (default) = bipolar source in [-100, 100],
  // 0 = neutral; we map to [-1.0, 1.0] by dividing by 100. True =
  // unipolar source in [0, 100] (e.g. joystick_rt_pct, a trigger);
  // we map raw=0 to 0.0 (neutral) and raw=100 to +1.0 (full forward).
  // Reverse is not reachable through a unipolar source; use a bipolar
  // source if you need it.
  bool unipolar = 4;

  // Flip the sign after scaling. Useful when the producer's positive
  // direction is opposite the autopilot's (e.g. some sticks publish
  // positive Y for backward).
  bool invert = 5;
}

message ControlAxisMapping {
  // -------------------------------------------------------------------
  // Contract for publishers feeding these axes
  // -------------------------------------------------------------------
  // Publishers MUST publish continuously (on a fixed cadence, NOT
  // on-change-only) for the entire duration they are driving an axis
  // — including when the value isn't changing. Recommended rate:
  // 10-20 Hz.
  //
  // This is load-bearing: a responder is sample-driven, and silence on
  // the Zenoh wire is the stop signal — so an on-change-only publisher
  // looks identical to a publisher dropout once the value stops
  // changing. Make sure your upstream emits whether or not the value
  // changed. (In mavlink2keelson, for example, each arriving sample
  // becomes one MAVLink RC_CHANNELS_OVERRIDE, and ArduPilot times the
  // override out after ~3 s of no frames.)
  // -------------------------------------------------------------------
  //
  // Per-axis subject mapping, keyed by axis name.
  //
  // Axis names. Bare "steering" and "throttle", and per-device
  // `<axis>/<device-id>`. Every value is bipolar percent, [-100, 100],
  // 0 neutral; the sign is never flipped by kind of device:
  //
  //   throttle/<id>  a propeller, or an azimuth's or waterjet's thrust.
  //                  ±100 = full ahead / full astern; positive ahead.
  //   steering/<id>  a rudder, or a waterjet's nozzle. ±100 = ±that
  //                  device's max_angle_deg, else its full travel either
  //                  side; positive turns her bow to starboard.
  //   thruster/<id>  a thruster. ±100 = ±its full rated thrust; positive
  //                  pushes to starboard, as thruster_power_pct.
  //   azimuth/<id>   an azimuth or pod's angle. ±100 = ±its max_angle_deg,
  //                  ±180° if it declares none; positive turns its thrust
  //                  clockwise from ahead seen from above, as
  //                  azimuth_angle_deg — so on a stern pod, positive swings
  //                  her bow to PORT, unlike a rudder.
  //
  // Bare names address the platform's single device for that axis, and
  // are valid only when exactly one device takes it. A platform that lists
  // no devices is taken to have one of each. With several rudders or
  // screws, each is addressed by `<axis>/<id>` and the bare name is
  // refused. "thruster" and "azimuth" have no bare form. A mapping that
  // drives one device through two names (e.g. "throttle" and
  // "throttle/main") is refused.
  //
  // A device id is a single key chunk naming one device on this platform —
  // e.g. "port", "main-rudder", "bow-1", "pod-aft". A platform lists its
  // devices in its config's `propulsion` block; the same chunk is the last
  // source_id chunk its reports go out under (thruster_power_pct/.../bow-1).
  //
  // A responder accepts the subset of these it can drive. Any other name
  // — unknown, a device it does not have, or a bare name on a platform
  // with several — causes the RPC to reply with ErrorResponse listing the
  // names it accepts.
  //
  // mavlink2keelson (ArduPilot Rover frame) accepts only bare "steering"
  // and "throttle", resolved to the autopilot's RCMAP_ROLL and
  // RCMAP_THROTTLE RC channels via its channel autodetect; Plane / Copter
  // support there would add "roll", "pitch", "yaw". Its unmapped axes go
  // out as neutral PWM (1500us) in the emitted RC_CHANNELS_OVERRIDE —
  // useful for layered manual+auto control ("autonomy steers, joystick
  // controls throttle").
  map<string, ControlAxis> axes = 1;

  // Minimum interval between actuator emissions (RC_OVERRIDE frames in
  // mavlink2keelson), in seconds. 0 (default) = emit on every axis
  // arrival. With two axes updating at the same producer cadence this
  // doubles the wire rate; setting min_interval_s to e.g. 0.05 caps the
  // output at 20 Hz.
  float min_interval_s = 2;

  // Dead-man: if any mapped axis's last sample is older than this
  // (in seconds, wall clock) the responder stops driving the actuators.
  // This is what catches a Zenoh-side dropout — without it, the last
  // order would survive a network split indefinitely. (mavlink2keelson
  // stops emitting RC_CHANNELS_OVERRIDE, letting ArduPilot's own RC
  // override timer expire and return control to the autopilot mode.)
  //
  // 0 (unset) = the default of 1.0 s, which assumes upstreams publish
  // at >= 10 Hz (lots of headroom for jitter). Set explicitly to tighten
  // or loosen. The dead-man cannot be disabled by design. (For
  // mavlink2keelson, values above ArduPilot's RC_OVERRIDE_TIME, ~3 s by
  // default, are pointless because ArduPilot would time out first.)
  float max_axis_age_s = 3;
}

message ControlAxisMappingAck {}

service VehicleControl {
  // Replace the active control-axis mapping atomically. An empty axes
  // map = stop driving (undeclare every axis subscriber). Calling this
  // RPC is the only way to make the vehicle drivable after a connector
  // start.
  rpc set_control_mapping(ControlAxisMapping)
      returns (ControlAxisMappingAck);

  // Return the currently-active mapping. Useful for operators
  // inspecting state set by another client.
  rpc get_control_mapping(google.protobuf.Empty)
      returns (ControlAxisMapping);
}

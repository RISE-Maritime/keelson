syntax = "proto3";

package keelson.interfaces.vehicle_navigation;

import "google/protobuf/timestamp.proto";
import "VehicleCommon.proto";

// A single position target for a vehicle in a guided / navigation mode.
// Vehicle-agnostic: maps onto MAVLink SET_POSITION_TARGET_GLOBAL_INT for
// the mavlink2keelson connector, but the same interface fits any vehicle
// connector that accepts a WGS84 position target.
message NavigationTarget {
  google.protobuf.Timestamp timestamp = 1;

  // WGS84 latitude / longitude in degrees.
  double latitude = 2;
  double longitude = 3;

  // Altitude above mean sea level in meters. Omit for surface vehicles
  // that operate at sea level by definition.
  optional float altitude_msl_m = 4;

  // Desired cruise speed for the leg in meters per second. Omit to let
  // the vehicle use its configured default.
  optional float ground_speed_mps = 5;

  // Target heading at arrival, degrees clockwise from true north. Omit
  // to let the vehicle pick its own arrival heading.
  optional float yaw_deg = 6;
}

// SET_POSITION_TARGET_GLOBAL_INT has no MAVLink-level acknowledgement
// (https://mavlink.io/en/messages/common.html); ArduPilot silently
// drops invalid targets (e.g. geofence violations) without a NAK or
// STATUSTEXT. The connector therefore briefly polls
// POSITION_TARGET_GLOBAL_INT after sending: if the autopilot's
// commanded target matches what we sent within a small tolerance,
// the result is ACCEPTED; otherwise NOT_OBSERVABLE (we cannot tell
// "silently rejected" from "stream wasn't running"). When
// `ground_speed_mps` is set the optional MAV_CMD_DO_CHANGE_SPEED
// COMMAND_ACK is folded into `detail`.
message NavigationTargetResponse {
  keelson.interfaces.common.CommandResult result = 1;
  int32 raw_autopilot_result = 2;
  string detail = 3;
}

// Set the vehicle's cruise (leg) speed in meters per second. Applied to
// the active waypoint / GUIDED-mode navigation. Maps onto MAVLink
// MAV_CMD_DO_CHANGE_SPEED for the mavlink2keelson connector.
message SetCruiseSpeedRequest {
  google.protobuf.Timestamp timestamp = 1;
  float speed_mps = 2;
}

message SetCruiseSpeedResponse {
  keelson.interfaces.common.CommandResult result = 1;
  int32 raw_autopilot_result = 2;
  string detail = 3;
}

// How a vehicle is told to steer. The frame is the field rather than a
// separate discriminator, so an order cannot name one frame and carry a
// value meant for another.
//
// The two are different instructions, not two spellings of one. A course
// over ground is made good against the water that is moving the hull; a
// heading is where she points, and in any current the two differ by the
// drift angle. A vehicle that treats them alike is wrong by that angle
// and says nothing about it.
message SteeringOrder {
  oneof frame {
    // Make good this course, degrees true, [0, 360).
    double course_over_ground_deg = 1;
    // Point this way, degrees true, [0, 360). What she makes good is then
    // whatever the water leaves her.
    double heading_deg = 2;
  }

  // How to turn onto the new course or heading. Absent: the vehicle's own
  // default turn. Both are magnitudes; the direction is the shorter way to
  // the ordered course or heading.
  //
  // A rate of turn and a radius are different instructions, not two
  // spellings of one: at a steady speed they are related by
  // rate = speed / radius, so a radius order turns faster as she speeds up
  // and a rate order sweeps a wider circle. A vehicle that cannot honour
  // the requested form replies COMMAND_RESULT_UNSUPPORTED rather than
  // converting it at whatever speed it happens to have.
  oneof turn {
    // Turn at this rate, degrees per second, > 0.
    double rate_of_turn_degps = 3;
    // Turn on a circle of this radius, metres, > 0.
    double turn_radius_m = 4;
  }
}

// A standing steering order: hold this course or heading until told
// otherwise — what a helmsman, or an autopilot in heading-hold, does.
//
// Not NavigationTarget.yaw_deg, which is the heading on arrival at a
// position target: a one-shot goal tied to a waypoint. This one has no
// destination and stays in force until replaced.
//
// Steering only. Speed is set_cruise_speed's, so a course can be changed
// without disturbing a speed. An order with no frame set is an error
// rather than a no-op — it is almost always a caller that failed to set
// the field it meant to. So is a turn with a rate or radius that is not
// greater than zero. A vehicle that cannot hold the requested frame
// replies COMMAND_RESULT_UNSUPPORTED rather than substituting the other.
message SetSteeringOrderRequest {
  google.protobuf.Timestamp timestamp = 1;
  SteeringOrder order = 2;
}

message SetSteeringOrderResponse {
  keelson.interfaces.common.CommandResult result = 1;
  int32 raw_autopilot_result = 2;
  string detail = 3;
}

service VehicleNavigation {
  // Commission the vehicle to navigate to a single target. Caller is
  // responsible for ensuring the vehicle is in an appropriate mode first
  // (e.g. GUIDED for ArduPilot Rover).
  rpc set_navigation_target(NavigationTarget) returns (NavigationTargetResponse);

  // Change cruise (leg) speed for the active navigation.
  rpc set_cruise_speed(SetCruiseSpeedRequest) returns (SetCruiseSpeedResponse);

  // Hold a course over ground or a heading until told otherwise, optionally
  // turning onto it at a given rate of turn or radius.
  rpc set_steering_order(SetSteeringOrderRequest) returns (SetSteeringOrderResponse);
}

//
// Subject:  navigation_state: keelson.NavigationState
// Key:      {base_path}/@v0/{entity_id}/pubsub/navigation_state/{producer}
// QoS:      elevated
// Spec:     protocols/navigation_conduct.yaml (this subject and the guidance order);
//           protocols/navigation_decisions.yaml (the encounters and advice it is read beside)
// Persist:  no (latest wins, 1 Hz)
//
// Overlaps RouteExecution on voyage_id / route_ref / current_leg_from_waypoint_id by design: the
// deciding process (this) and the executing vessel (RouteExecution) are different producers, and
// each states what it is working from.

syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "Route.proto";                 // RouteRef
import "OperationalAuthority.proto";  // AuthorityLevel
import "Coordinate.proto";            // GoTo

package keelson;

// What the vessel's navigation function is doing right now, stated by the process doing it.
//
// Not a lock and not a grant. command_authority says who holds the conn, operational_authority
// says the most the vessel may claim, and this says what navigation made of both. A consumer
// deciding whether to act on the vessel reads those, never this.
message NavigationState {

  enum Mode {
    MODE_UNSPECIFIED = 0;
    // No active voyage, or none this process can resolve.
    MODE_IDLE = 1;
    // A voyage is active and monitored. Not holding the conn, commanding nothing.
    MODE_READY = 2;
    // Holding the conn and commanding the vessel along the voyage.
    MODE_UNDERWAY = 3;
    // Lost something it needs to navigate (conn, authority, fresh ownship state) and has
    // commanded its declared safe state. `reason` and `degraded_inputs` say what.
    MODE_FALLBACK = 4;
    // Reached the final waypoint of the active voyage.
    MODE_ARRIVED = 5;
    // The voyage was completed or aborted; conn released.
    MODE_ENDED = 6;
  }

  // Refines MODE_UNDERWAY; UNSPECIFIED in every other mode.
  enum SubMode {
    SUB_MODE_UNSPECIFIED = 0;
    SUB_MODE_TRACK = 1;      // following the planned track
    SUB_MODE_AVOIDING = 2;   // executing accepted collision-avoidance advice
    SUB_MODE_HOLDING = 3;    // speed zero, drifting on a loiter, or on station (hold, go_to, DP)
    SUB_MODE_REROUTING = 4;  // awaiting a new route edition
    SUB_MODE_STEERING = 5;   // an ordered course or heading, or making for an ordered position (GuidanceOrder)
  }

  google.protobuf.Timestamp timestamp = 1;
  Mode mode = 2;
  SubMode sub_mode = 3;

  // The voyage being monitored or sailed. Absent in MODE_IDLE.
  optional string voyage_id = 4;

  // The route edition in force. Absent when no edition is resolved; never `latest`.
  optional RouteRef route_ref = 5;

  // The leg being sailed, named by the waypoint it leaves (RouteExecution convention).
  optional string current_leg_from_waypoint_id = 6;

  // The operational_authority level this process is acting under. UNKNOWN when it has heard
  // none, which is non-authorising exactly as OperationalAuthority defines it.
  OperationalAuthority.AuthorityLevel authority_level_in_force = 7;

  // True only while this process holds a live command_authority lease, judged on its own clock.
  bool conn_held = 8;

  // Why the process is in this mode. For operators and logs; consumers MUST NOT parse it.
  string reason = 9;

  // Subjects this process needs and currently lacks or holds stale, e.g. "location_fix".
  repeated string degraded_inputs = 10;

  // The guidance order in force: what this process has been told to steer by, whether or not it
  // holds the conn to do it. Absent when it has no voyage. Set through navigation_control/v1.
  optional GuidanceOrder guidance_order = 11;
}

// How a navigation process is ordered to steer while a voyage is active. The one type used both to
// give the order (navigation_control/v1 set_guidance_order, load_route) and to report the order in
// force (NavigationState.guidance_order), so what was asked and what is held read alike.
//
// The frame is the field, as in vehicle_navigation/v1's SteeringOrder, so an order cannot name one
// frame and carry a value meant for another. Course over ground and heading are different
// instructions: in any current they differ by the drift angle.
message GuidanceOrder {
  // Follow the planned track of the active route edition.
  message Track {
    // Rejoin at this waypoint (Waypoint.id, never an index). Absent: the leg the process judges
    // current, which is how a hand-back from a course or heading order resumes.
    optional string resume_from_waypoint_id = 1;
    // Sail parallel to the planned legs, this far off their centreline, metres; + is starboard of
    // the direction of travel. A temporary offset (traffic, a vessel to pass): the order in force
    // until changed. Absent or 0: the centreline. At most one of the two offsets.
    optional double cross_track_offset_m = 2;
    // The same, as a share of the current leg's corridor on that side, -1..1 (+ starboard):
    // resolved per leg against its xtd_port_m / xtd_starboard_m, so the offset follows each leg's
    // width. The responder keeps her inside the corridor, never on its edge.
    optional double cross_track_offset_fraction = 3;
    // Sail the route in reverse: turn around and follow its legs back towards the first waypoint.
    // The route edition is unchanged -- not a new route. resume_from_waypoint_id, when given, names
    // the waypoint to make for in that direction.
    optional bool reverse = 4;
  }

  // Stop making way and keep station where the order finds her, until told otherwise.
  message Hold {}

  // Make for a position, then keep station there, until told otherwise. Off the track: the process
  // steers for the point (SUB_MODE_STEERING) and, once arrived, holds there (SUB_MODE_HOLDING) with
  // this order still the one in force, so a station can read why she is holding where she is.
  // Arrival ends the order's passage, never the voyage.
  message GoTo {
    keelson.Coordinate position = 1;
    // Arrived within this distance of `position`, metres. Absent: the responder's own threshold.
    optional double arrival_radius_m = 2;
  }

  // Hold a position AND a heading throughout, as a DP system does: turn to the heading, walk to the
  // position in any direction, then keep both. Walking there is SUB_MODE_STEERING, on station
  // SUB_MODE_HOLDING, with this order still the one in force. It needs lateral authority
  // (thrusters, azimuths, a vectored drive): a responder, or a vehicle behind it, without that
  // answers UNSUPPORTED and never approximates it by a `go_to`, which keeps no heading.
  message DynamicPositioning {
    keelson.Coordinate position = 1;
    // The heading to hold, degrees true, [0, 360). Absent: the heading the order finds her on.
    optional double heading_deg = 2;
    // How fast to walk onto the position, knots, > 0. Absent: the responder's own.
    optional double walk_speed_knots = 3;
  }

  // Make for a position, then lie in neutral and drift with wind and stream (SUB_MODE_HOLDING).
  // Carried out past `radius_m`, make back for the position at `return_speed_knots`
  // (SUB_MODE_STEERING) and go neutral again once near it. Needs no lateral authority, and keeps
  // no heading: a vessel that must keep her head somewhere is given `dynamic_positioning`.
  message Loiter {
    keelson.Coordinate position = 1;
    // How far she may drift from `position` before making back for it, metres, > 0.
    double radius_m = 2;
    // Speed through the water to make back at, knots, > 0. Absent: the responder's own. Faster
    // than the stream, or she cannot.
    optional double return_speed_knots = 3;
  }

  oneof order {
    Track track = 1;
    // Make good this course, degrees true, [0, 360).
    double course_over_ground_deg = 2;
    // Point this way, degrees true, [0, 360).
    double heading_deg = 3;
    Hold hold = 4;
    GoTo go_to = 6;
    DynamicPositioning dynamic_positioning = 7;
    Loiter loiter = 8;
  }

  // Speed through the water to keep, in knots. Absent: the planned speed of the current leg for
  // `track`; the speed she has for a course or a heading; for the passage to a `go_to` position, the
  // speed she has or, when she is stopped, the responder's own transit speed, so that a go_to given
  // from a hold makes way rather than keeping the zero she has; the passage to a `loiter` position
  // likewise. Ignored by `hold`, by `go_to` once arrived, by a drifting `loiter` (its return is
  // `return_speed_knots`), and by `dynamic_positioning` (its walk is `walk_speed_knots`).
  optional double speed_knots = 5;

  // The planned speed times this, > 0 (1.1 = ten per cent above plan): for `track`, a trim on the
  // legs' planned speeds rather than a fixed speed. At most one of speed_knots and
  // speed_plan_factor; both absent is the plan's own speed.
  optional double speed_plan_factor = 9;
}

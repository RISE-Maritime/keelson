syntax = "proto3";

import "google/protobuf/timestamp.proto";

package keelson;

// Snapshot of a checklist procedure's progress, used to bootstrap late-joining operators.
// Published periodically and on procedure activation for synchronization between ROC sites.
message ChecklistState {

  message ItemNote {
    string note_id = 1;
    string text = 2;
    google.protobuf.Timestamp created_at = 3;
    string author = 4;
    string author_roc_site = 5;
  }

  message ItemState {

    enum ItemStatus {
      ITEM_STATUS_PENDING = 0;
      ITEM_STATUS_IN_PROGRESS = 1;
      ITEM_STATUS_COMPLETED = 2;
    }

    string item_id = 1;
    ItemStatus status = 2;
    google.protobuf.Timestamp started_at = 3;
    string started_by = 4;
    string started_by_roc_site = 5;
    google.protobuf.Timestamp completed_at = 6;
    string completed_by = 7;
    string completed_by_roc_site = 8;
    repeated ItemNote notes = 9;
    bool flagged = 10;
    string flag_reason = 11;
    string flagged_by = 12;
    string flagged_by_roc_site = 13;
  }

  google.protobuf.Timestamp timestamp = 1;
  string procedure_id = 2;
  string published_by_operator = 3;
  string published_by_roc_site = 4;

  // Number of events this snapshot has incorporated. Used as a version guard: a snapshot
  // carrying fewer events than a receiver has already applied is stale and must be ignored.
  int32 event_count = 5;

  repeated ItemState items = 6;
}

syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "Fence.proto";
import "GuidanceCandidate.proto";
import "EntityHealth.proto";  // keelson.HealthLevel

package keelson;

// What the motion gate is emitting, one message per cycle, every DOF: the rolling acknowledgement of
// crowsnest-dev docs/COMMAND-ARCHITECTURE.md §4.3 and the source of the HMI's three states
// (protocols/control_gate.yaml). Downstream (mavlink2keelson, Slipway) consumes this, and only this.
//
// ABSENCE IS ABSENCE. `accepted_pct` absent means the gate emits NOTHING for that DOF (a stop, the
// local lockout), never 0; `actual_pct` absent means nothing reports what the DOF is doing.
// Feedback the gate does not have is FEEDBACK_QUALITY_NONE, never an estimate dressed as a reading.
message ResolvedControl {
  google.protobuf.Timestamp timestamp = 1;
  string vessel_id = 2;

  // The motion fence in force this cycle.
  Fence motion_epoch = 3;

  // Rises by one per message, per gate incarnation (a new motion_epoch term restarts it).
  uint64 sequence = 4;

  // ACTUATION_ALLOWED ⇒ safety_state CLEAR ∧ ¬local_lockout (∧ maintenance INACTIVE ∧ the
  // lifecycle permits). False: every DOF is INHIBITED and emits nothing.
  bool actuation_allowed = 5;
  string actuation_reason = 6;

  // The configured transition state (safe_state_policy), never an implicit "nobody".
  bool in_transition = 7;
  string transition_reason = 8;

  repeated ResolvedDof dofs = 9;

  // Per coupled group, a sequence that rises by one per cycle the group is resolved, so a consumer
  // applies a group's DOFs together and never half of it.
  repeated GroupSequence groups = 10;

  // The gate that wrote it, e.g. "control-gate": the slot's writer.
  string gate_id = 11;
}

message ResolvedDof {
  string dof = 1;

  // What the mapped source asked for, last accepted. Absent: nothing accepted.
  optional double requested_pct = 2;

  // What the gate emits. Absent: it emits NOTHING for this DOF.
  optional double accepted_pct = 3;

  // What the DOF is doing, from feedback. Absent: no feedback.
  optional double actual_pct = 4;

  ControlState control_state = 5;

  // The execution_source the value came from; empty when none.
  string source = 6;

  // Why, when not ACTIVE.
  string reason = 7;

  google.protobuf.Timestamp actual_sample_time = 8;
  optional uint32 actual_age_ms = 9;
  FeedbackQuality feedback_quality = 10;
  string feedback_source = 11;

  // Where the downstream reports it: the last candidate sequence it applied.
  optional uint64 last_applied_command_sequence = 12;

  // PROVENANCE of the accepted sample (crowsnest-dev#98, COMMAND-ARCHITECTURE §7): which candidate
  // this DOF's value came from and when, so a station can time the hops input → acceptance. For
  // audit and latency ONLY: the gate copies them and never judges them; freshness stays
  // receive-side on the gate's own clock. Absent when no sample is accepted (STALE, TRANSITION,
  // INHIBITED, UNMAPPED). The hops, with ResolvedControl.timestamp as t4 (this emission):
  //   t1 source_sample_time   the source's clock — the HID read, not the publish
  //   t2 source_published_at  the source's clock — the candidate envelope's enclosed_at
  //   t3 gate_received_at     the gate's wall clock at receipt
  //   t3→t4 gate_hold_ms      the gate's monotonic clock: exact, whatever the wall clocks say
  // t1→t2 is on one clock. t2→t3 crosses two: comparable as is only when source_clock_quality is
  // CLOCK_QUALITY_SYNCHRONISED; otherwise a reader corrects it by a measured offset
  // (network_status.clock_skew_ms) and says so, or shows no number.
  string source_stream_id = 13;
  uint64 source_sequence = 14;
  google.protobuf.Timestamp source_sample_time = 15;
  google.protobuf.Timestamp source_published_at = 16;
  ClockQuality source_clock_quality = 17;
  google.protobuf.Timestamp gate_received_at = 18;
  optional uint32 gate_hold_ms = 19;

  // What the accepted sample says about ITSELF (crowsnest-dev#309): ControlCandidate.profile_version
  // and device_health, copied. A station can then tell why a helm's samples are late -- its own read
  // watchdog says DEGRADED -- and a recording says which calibration shaped the value. Informational,
  // like the provenance above: the gate never refuses a DEGRADED helm for being DEGRADED; validity
  // stays receive-side freshness. Empty / HEALTH_UNKNOWN when no sample is accepted, or when the
  // source does not say (a guidance candidate has neither).
  string source_profile_version = 20;
  HealthLevel source_device_health = 21;
}

enum ControlState {
  CONTROL_STATE_UNSPECIFIED = 0;
  // The mapped source's fresh, accepted value is emitted.
  CONTROL_STATE_ACTIVE = 1;
  // The mapped source is silent past the dead-man; the transition value is emitted.
  CONTROL_STATE_STALE = 2;
  // The configured transition state (abort, a lapsed conn, no map).
  CONTROL_STATE_TRANSITION = 3;
  // ACTUATION_ALLOWED is false: nothing is emitted.
  CONTROL_STATE_INHIBITED = 4;
  // No map for this DOF.
  CONTROL_STATE_UNMAPPED = 5;
}

enum FeedbackQuality {
  FEEDBACK_QUALITY_UNSPECIFIED = 0;
  FEEDBACK_QUALITY_VALID = 1;
  FEEDBACK_QUALITY_STALE = 2;
  FEEDBACK_QUALITY_ESTIMATED = 3;
  // No feedback for this DOF.
  FEEDBACK_QUALITY_NONE = 4;
}

message GroupSequence {
  string group_id = 1;
  uint64 sequence = 2;
}

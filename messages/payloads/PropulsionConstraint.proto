syntax = "proto3";

package keelson;

import "google/protobuf/timestamp.proto";
import "Attestation.proto";

// The engineer's veto: how far each propulsion device may be driven.
//
// Someone other than the conn holder is responsible for the plant — power,
// propulsion, equipment availability — and the engine room has always been able
// to say "not more than 60 % on the starboard engine" without taking the helm.
// This is that record. It NARROWS what the conn may order and never steers: it
// is not an emergency (an engineer who needs the ship stopped uses the safety
// trip like any other holder), and it is never a motion order.
//
// KEY. `propulsion_constraint/{vessel_id}` — one stored slot per vessel
// (`storage: latest`), written ONLY by an operator attested as holding
// ROLE_ENGINEER (keelson.Attestation, carry-over C3), or by an onboard plant
// process the vessel's manifest names. protocols/motion_constraints.yaml is
// normative. Carried over from keelson #358 onto the conn (decision 0001, C4).
//
// READERS.
//   - the conn supervisor (protocols/conn.yaml), which clamps every effector
//     output per device in allocation: whatever the conn holder orders, a
//     derated device does not exceed `max_power_pct`, and an inhibited device
//     sits at zero;
//   - the conn holder's station, as a reported constraint ("derated by the
//     engineer: 60 %, reason") — never as something the conn can lift;
//   - the navigation process, when it holds `speed_control` at control method 3
//     or above, so the planned speed is capped rather than fought for.
//
// SILENCE NEVER LIFTS IT. When the engineer goes quiet, or loses the role
// ashore, the last constraint holds; nothing clears a constraint but a newer
// revision that says so.
//
// NOT TIED TO A HOLDER. The constraint belongs to the vessel, not to the
// engineer who wrote it: a change of engineer ashore lifts nothing, and the new
// engineer's first revision replaces it whole. A conn supervisor that restarts
// restores the constraint it last accepted from its own store before it allows
// arming — or refuses to arm until it has read the stored slot. Neither a change
// of engineer nor a restart can relax it.
//
// REVISION. `revision` rises by one with every change, for the slot's whole
// life, and never restarts: a writer reads the stored slot first and writes its
// revision + 1. A receiver applies a record only if its revision is greater than
// the last it applied, so a replayed or reordered constraint cannot roll a newer
// one back. Freshness of a person's write is the attestation's (its challenge),
// judged once, when the receiver first accepts the revision; a restored record
// is not re-judged.
//
// Design: crowsnest-dev docs/COMMAND-ARCHITECTURE.md §1.1, invariants I11 and I16.
message PropulsionConstraint {
  // When this revision was issued.
  google.protobuf.Timestamp timestamp = 1;

  // The vessel this constrains; the last token of the key. One key chunk.
  string vessel_id = 2;

  // The engineer that wrote it — the attested operator_id and site, or the
  // plant process's id — shown beside the constraint at the conn.
  string controller_id = 3;
  string controller_site = 4;

  // #358's `fence` (plant_generation, the motion gate's). Superseded by the
  // revision and the attestation.
  reserved 5;
  reserved "fence";

  // Rises by one per change for the slot's whole life (see the header).
  uint64 revision = 6;

  // One limit on one propulsion device.
  message DeviceConstraint {
    // The device, by the id it has on the platform's `propulsion[]` (keelson#326):
    // one key chunk, e.g. `main`, `port`, `bow-1`.
    string device_id = 1;

    // The highest power the device may be driven at, in percent of its rating
    // (0–100). UNSET means no cap — explicit presence, so "no cap" and a cap of
    // 0 are never confused.
    optional double max_power_pct = 2;

    // The device must not be driven at all: the gate holds it at zero.
    bool inhibit = 3;

    // Why, in the engineer's words. Shown at the conn.
    string reason = 4;
  }

  // The constrained devices. A device not listed is unconstrained. An empty list
  // is "no constraint" — and is only ever a NEWER revision, never an absence.
  repeated DeviceConstraint devices = 7;

  // The engineer's signed claim over this revision (procedure
  // "propulsion_constraint"), granting ROLE_ENGINEER; its operator_id and site
  // equal controller_id and controller_site. Required from a person; a record
  // from a person without it, or with one that does not verify, is not applied.
  // Absent on a write by a plant process the manifest names.
  optional Attestation attestation = 8;
}

syntax = "proto3";

package keelson;

// A fence: whose authority a message is under.
//
// Every counter that fences actuation in the command architecture is a PAIR,
// and the two halves have different owners:
//
//   term        the incarnation of the ENFORCEMENT domain — the motion gate for
//               `motion_epoch` and `plant_generation`, the payload gate for
//               `payload_epoch`, the safety supervisor for `safety_generation`.
//               It changes only when that enforcer is reinitialised from an
//               empty store, and then it is drawn as a fresh random 128-bit
//               value, never "last + 1", so no two lives of one enforcer can
//               share a term. Hex-encoded, 32 characters, like a lease token.
//   generation  the counter within that term. Proposed by the manager of the
//               domain, ACCEPTED AND MINTED BY THE ENFORCER: the motion gate
//               reserves (T, n+1) when it ACKs a transfer, and increments alone
//               when it must act without the manager (a lapsed conn, an invalid
//               source, an abort, a local fallback). The supervisor bumps
//               `safety_generation` on every STOP that latches and every RESET
//               that clears.
//
// A receiver accepts on EQUALITY of the pair. A message from a term that no
// longer exists is rejected whatever its generation, which is what lets a
// reinitialised gate start at (T', 1) without colliding with anything from its
// previous life.
//
// ONLY THE VESSEL MINTS A FENCE. Nothing on shore writes one: a station carries
// the fence it was last told (Caller.fence, ControlMapping.fence), and a RESET
// names the fence it expects to clear (EmergencyRequest.expected_stopped_fence).
// The restart of an authority manager mints nothing and interrupts no healthy
// conn — it reads the enforcer's exposed pair and proposes the next generation
// within it.
//
// FENCE ≠ ORDERING. A fence says whose authority a message is under; it does
// not order messages. Stored control-plane records carry a `revision` beside
// their fence, and a receiver applies one only if the fence is current AND the
// revision is greater than the last it applied under that fence. High-rate
// candidates carry a stream id and a sequence instead (GuidanceCandidate).
//
// Shared by CommandAuthority, ControlMapping, SafetyState and the vehicle
// interfaces' Caller (interfaces/VehicleCommon.proto). Design:
// crowsnest-dev docs/COMMAND-ARCHITECTURE.md §0 and §4.
message Fence {
  // The enforcer's incarnation: 16 random bytes, hex-encoded (32 characters).
  // Empty means "no fence" and is never accepted where a fence is required.
  string term = 1;

  // The counter within `term`. Starts at 1 in a new term; 0 is never a minted
  // value, so a zero generation reads as absent.
  uint64 generation = 2;
}

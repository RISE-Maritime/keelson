syntax = "proto3";

import "google/protobuf/timestamp.proto";

package keelson;

// Heartbeat message published by each operator to indicate their presence and current focus
// within the checklist application. Used to show remote operator activity across ROC sites.
message ChecklistPresence {

  enum CursorState {
    CURSOR_IDLE = 0;
    CURSOR_VIEWING = 1;
    CURSOR_EDITING_NOTE = 2;
  }

  google.protobuf.Timestamp timestamp = 1;
  string operator_id = 2;
  string username = 3;
  string role = 4;
  string roc_site = 5;
  string active_procedure_id = 6;
  string active_item_id = 7;
  CursorState cursor = 8;
}

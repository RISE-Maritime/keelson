//
// Subject:  advice_disposition: keelson.AdviceDisposition
// Key:      {base_path}/@v0/{entity_id}/pubsub/advice_disposition/{voyage_id | novoyage}/{advice_id}  (slot)
// QoS:      elevated
// Spec:     protocols/navigation_decisions.yaml
// Persist:  yes (last decision per advice)

syntax = "proto3";

import "google/protobuf/timestamp.proto";

package keelson;

// The decision on one NavigationAdvice, and who made it.
//
// Written ONLY by whoever holds the decision for the function (an operator at a station, or a
// conduct service under a grant): ACCEPTED or REJECTED. Only ACCEPTED licenses acting, and only
// within the advice's validity window.
//
// The advisor does not write this slot. It retires its own advice on NavigationAdvice
// (retired_at, retirement), because a slot with two writer roles keeps whichever wrote last, and
// the advisor's EXPIRED replaced the operator's ACCEPTED in storage (keelson#283).
message AdviceDisposition {

  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_ACCEPTED = 1;
    STATE_REJECTED = 2;
    // Deprecated (keelson#283): retirement is NavigationAdvice.retirement. Kept so records stored
    // by 0.6.0-pre.18 producers still decode; never published, and a consumer ignores them.
    STATE_SUPERSEDED = 3 [deprecated = true];
    STATE_EXPIRED = 4 [deprecated = true];
  }

  google.protobuf.Timestamp timestamp = 1;
  string advice_id = 2;
  optional string voyage_id = 3;
  State state = 4;

  // Who: "ted@ROC-1", or the source id of the service that decided. Free text, like raised_by,
  // changed_by and acknowledged_by elsewhere.
  string decided_by = 5;
  reserved 6;
  reserved "decided_site";

  // Deprecated with STATE_SUPERSEDED (keelson#283): NavigationAdvice.superseded_by.
  optional string superseded_by = 7 [deprecated = true];

  // Free text. Consumers MUST NOT parse it.
  string reason = 8;
}

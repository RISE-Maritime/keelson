syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "Route.proto";   // RouteRef

package keelson;

// RouteExecution is the live, ephemeral monitoring snapshot for an active
// voyage. Published at ~1 Hz on the vessel-bridge to the pubsub key tree
// (NOT persisted by storage_manager). Subscribers (ROCs, ECDIS overlays)
// consume it to render current position relative to the planned route.

message RouteExecution {

  // Sample timestamp.
  google.protobuf.Timestamp timestamp = 1;

  // Voyage this sample belongs to.
  string voyage_id = 2;

  // The route edition being tracked. If the active route is bumped mid-voyage,
  // this reference is re-pinned to the new edition.
  reserved 3, 4;
  reserved "route_id", "route_edition_number";
  RouteRef route_ref = 5;

  // -- Progress ---------------------------------------------------------------
  // Progress is addressed by STABLE WAYPOINT ID, never by array index.
  //
  // An index into Route.waypoints means a different waypoint the moment a
  // waypoint is inserted or removed — and editions exist precisely so that
  // routes change. The same waypoints are addressed by stable id everywhere
  // else (ScheduleElement, RouteChallenge); indices here were the odd one out,
  // and the fragile one.
  //
  // A leg is the outgoing edge of a waypoint, so the leg being sailed is named
  // by the waypoint it leaves. `optional` so unset means "not yet under way" —
  // distinct from being on the leg leaving a waypoint whose id happens to be
  // the empty string.
  reserved 10, 11;
  reserved "current_leg_index", "next_waypoint_index";
  optional string current_leg_from_waypoint_id = 15;

  // Stable id of the next waypoint to be reached. Unset before departure and
  // after final arrival.
  optional string next_waypoint_id = 16;

  // Great-circle distance to the next waypoint (metres).
  float distance_to_next_waypoint_m = 12;

  // Cross-track distance, signed: +stbd / -port of the planned track (metres).
  float xtd_m = 13;

  // True bearing to the next waypoint (degrees).
  float bearing_to_next_deg = 14;

  // -- ETAs -------------------------------------------------------------------
  google.protobuf.Timestamp eta_next_waypoint = 20;
  google.protobuf.Timestamp eta_arrival = 21;

  // -- Deviation state --------------------------------------------------------
  // True when |xtd_m| exceeds the leg's XTD limit; used by UI to flip colour
  // and trigger alarms.
  bool deviation_active = 30;

  // Threshold used to determine deviation_active (metres). Sourced from the
  // current Leg's xtd_port_m / xtd_stbd_m or a configured fallback.
  float deviation_threshold_m = 31;

  // -- Kinematics (echo of own-ship state for convenience) --------------------
  // Knots to match the bus convention (subjects.yaml: speed_over_ground_knots)
  // and the speed units used everywhere else on Route/Leg/ScheduleElement.
  float speed_over_ground_knots = 40;
  float course_over_ground_deg = 41;
}

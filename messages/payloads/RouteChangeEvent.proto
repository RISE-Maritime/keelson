syntax = "proto3";

import "google/protobuf/timestamp.proto";

package keelson;

// RouteChangeEvent is the append-only audit log entry written every time a
// route edition is bumped. One event is published per edition bump, as step 3
// of the three-publish choreography in protocol-specification.md §6.4:
//   {base_path}/@v0/{entity_id}/pubsub/route_change_event/{route_id}/{change_id}
// There is no separate `state/` key tree — durability is a router
// `storage_manager` responsibility, not a payload or key-space one (§6.3).

message RouteChangeEvent {

  // Unique change identifier (UUID). Also used as the trailing key segment.
  string change_id = 1;

  string route_id = 2;

  // Edition transition described by this event.
  uint32 old_edition = 3;
  uint32 new_edition = 4;

  google.protobuf.Timestamp at = 5;

  // Identity that authored the change.
  string author_id = 6;
  string author_site = 7;

  // Free-form reason ("initial plan", "bridge review", "weather reroute",
  // "force_override", "migrated_from_localstorage", ...).
  string reason = 8;

  // Short human-readable summary ("added 3 waypoints", "shifted WP-5 80m N").
  string change_summary = 9;

  // Field 10 was `google.protobuf.Any diff`, an optional structured diff.
  // Removed per the #154 decision recorded in protocol-specification.md §6.8:
  // an Any is undecodable through the subject registry, which is how
  // everything else on the bus is self-describing, and unlike the vendor
  // extension hatch in Route.Extensions it was not required by the RTZ 1.2 /
  // S-421 interchange format — it was a convenience. A diff that no
  // independent consumer can decode is not an audit record; `change_summary`
  // already carries the human-readable one. If a structured diff is wanted
  // later, add it as a typed message rather than reinstating the Any.
  reserved 10;
  reserved "diff";
}

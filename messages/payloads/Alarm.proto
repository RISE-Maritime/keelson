//
// Subject:  alarm: keelson.Alarm
// Key:      {base_path}/@v0/{entity_id}/pubsub/alarm/{producer}/{identifier}  (instance)
// QoS:      elevated
// Spec:     protocols/alarm.yaml
// Persist:  yes (latest per alarm)
//
// One alarm per key, written only by the source that raised it. Stations do
// not publish here: an acknowledgement reaches the raiser through
// alarm_ack/v1 (interfaces/AlarmAck.proto), and the raiser republishes.

syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "foxglove/RawImage.proto";
import "foxglove/CompressedImage.proto";
import "foxglove/CompressedVideo.proto";
import "Audio.proto";
import "Severity.proto";

package keelson;

// The ALERT management messages 

// Represents an alarm message with various attributes such as timestamp, source, identifier, description, category, priority, acknowledgers, audio, visual, activation and expiration times, duration, and acknowledgment scheme.
message Alarm {

  reserved 2, 3;
  
  // The timestamp when the alarm was initiated.
  google.protobuf.Timestamp timestamp = 1;
  
  // A unique identifier for the alarm.
  string identifier = 4;   
  
  // A description of the alarm.
  string description = 5;
  
  // The category of the alarm.
  Category category = 6; 
  
  // The priority level of the alarm.
  Priority priority = 7;  

  // Every acknowledgement the raiser has recorded, earliest first. Any station
  // may acknowledge, and each one is kept: a second station acknowledging
  // does not replace the first. Only the raiser writes this list.
  repeated AlarmAcknowledgment acknowledgers = 8;

  // Audio information related to the alarm.
  keelson.Audio audio = 9; // Added
  
  // Visual information related to the alarm.
  Visual visual = 10; // Added
  
  // The UTC time when the alarm was activated.
  google.protobuf.Timestamp activation_time_utc = 11; 
  
  // The restatement deadline. A raiser republishes an active alarm well
  // before this passes. If it passes with no restatement and no cleared_at,
  // the alarm has EXPIRED: its raiser stopped speaking, which is not the same
  // as the condition clearing.
  google.protobuf.Timestamp expiration_time_utc = 12;
  
  // The duration of the alarm in seconds.
  int32 duration_seconds = 13; 
  
  // The acknowledgment scheme for the alarm.
  AckScheme ack_scheme = 14; // 
  
  // The severity level of the alarm. Shared vocabulary from
  // Severity.proto; wire values are unchanged from the previous nested
  // enum (LOW=1, MEDIUM=2, HIGH=3, CRITICAL=4).
  SeverityLevel severity = 15;
  
  // True once any acknowledgement has been recorded in `acknowledgers`.
  // Acknowledging never clears the alarm.
  bool acknowledged = 16;

  // When the raiser cleared the condition. Set by the raiser only, never by an
  // acknowledgement. Unset while the alarm stands. Distinct from expiry: before
  // this field a cleared alarm could only be published already expired, which a
  // reader could not tell from a raiser that had died.
  google.protobuf.Timestamp cleared_at = 17;

  enum Category {
    CATEGORY_UNSPECIFIED = 0;
    CATEGORY_SAFETY = 1;
    CATEGORY_NAVIGATION = 2;
    CATEGORY_TECHNICAL = 3;
    CATEGORY_FIRE_ALARM = 4;
  }
  
  enum Priority {
    PRIORITY_UNSPECIFIED = 0;
    PRIORITY_NORMAL = 1;
    PRIORITY_CAUTION = 2;
    PRIORITY_WARNING = 3;
    PRIORITY_EMERGENCY = 4;
  }

  // Whether, and how, the alarm is acknowledged. See protocols/alarm.yaml.
  enum AckScheme {
    // Read as ACK_IMMEDIATELY: an unstated scheme fails toward attention.
    ACK_UNSPECIFIED = 0;

    // An operator must acknowledge. The alarm stays unacknowledged until one
    // does, and clearing it does not acknowledge it.
    ACK_IMMEDIATELY = 1;

    // The raiser records its own acknowledgement when it clears the alarm (the
    // condition rectified itself). Stations may still acknowledge before then.
    ACK_AUTO = 2;

    // Not acknowledgeable. The raiser declines every acknowledgement, and a
    // consumer never treats the alarm as awaiting one. A raiser that serves no
    // alarm_ack/v1 MUST use this.
    ACK_NONE = 3;
  }
}

message AlarmAcknowledgment {
  google.protobuf.Timestamp timestamp_acknowledged = 1;
  string acknowledged_by = 2;
}


message Visual {
  google.protobuf.Timestamp timestamp = 1;
  string description = 2;
  foxglove.RawImage image = 3;
  foxglove.CompressedImage compressed_image = 4;
  foxglove.CompressedVideo compressed_video = 5;
}

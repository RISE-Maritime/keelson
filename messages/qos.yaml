# QoS profiles for well-known subjects.
#
# Companion to subjects.yaml. subjects.yaml says WHAT a subject carries (its
# protobuf type); this file says HOW it should travel (priority, congestion
# behaviour, reliability, batching).
#
# Profiles are named for their *transport stance*, not the domain they're used
# in — the subject already carries the domain, and unrelated domains share a
# profile when they share wire behaviour (a radar spoke and a camera frame are
# both `transient` because both are high-rate and loss-tolerant, not because
# they're the same kind of data).
#
# A subject's profile is derived from how its data should be treated on the
# bus, NOT from which connector publishes it — so QoS stays consistent no
# matter who produces a subject. A connector may still override per-publisher.
#
# Values are Zenoh-shaped strings; the SDK maps them to zenoh.* enums (see
# sdks/python/keelson/scaffolding/qos_zenoh.py). Any subject not listed under
# `subjects:` inherits `default`.
#
# Fields per profile:
#   priority            REAL_TIME | INTERACTIVE_HIGH | INTERACTIVE_LOW |
#                       DATA_HIGH | DATA | DATA_LOW | BACKGROUND
#   congestion_control  DROP (shed on a full egress queue, never block the
#                            producer thread) | BLOCK (backpressure: stalls the
#                            publishing thread, so it is only safe off a
#                            hardware/IO read thread — a constraint on who may
#                            publish a BLOCK subject, not only on the profile)
#   reliability         RELIABLE (retransmit lost fragments on reliable
#                                 transports) | BEST_EFFORT
#   express             true (flush immediately, lowest latency) |
#                       false (allow batching, better throughput)
#
# NB: reliability is hop-by-hop on reliable transports, not an end-to-end
# delivery ack. For "a late subscriber must still get the last value" use an
# RPC/queryable or republish-on-interval — QoS alone will not backfill.

profiles:

  # Tele-operation hot path: operator inputs driving the vehicle right now.
  # Outranks everything (REAL_TIME) and flushes immediately; DROP keeps
  # "latest command wins" and never stalls the input thread.
  realtime:
    priority: REAL_TIME
    congestion_control: DROP
    reliability: RELIABLE
    express: true

  # High-rate frames whose values are short-lived — each is superseded by the
  # next, so freshness beats completeness. BEST_EFFORT avoids retransmitting
  # stale frames; batched for throughput.
  transient:
    priority: INTERACTIVE_HIGH
    congestion_control: DROP
    reliability: BEST_EFFORT
    express: false

  # Above-normal priority: live state operators/autopilots act on, plus
  # safety-critical situational data. Reliable, batched (small + frequent).
  elevated:
    priority: DATA_HIGH
    congestion_control: DROP
    reliability: RELIABLE
    express: false

  # Baseline: routine measurement telemetry (the long tail of Timestamped*).
  # Identical to Zenoh's own defaults, so unlisted subjects need no entry.
  default:
    priority: DATA
    congestion_control: DROP
    reliability: RELIABLE
    express: false

  # Not shed locally, at the cost of back-pressure on the producer. The only
  # profile with congestion_control BLOCK: for a subject where a lost message
  # is not a degraded reading but a broken guarantee — a barrier stalling on an
  # acknowledgement that was discarded on the way out.
  #
  # Named for what BLOCK does rather than for what it is easily mistaken for.
  # It stops the local egress queue shedding this message; it is not an
  # end-to-end delivery guarantee. Per the NB above, reliability is hop-by-hop
  # with no backfill — with no subscriber attached the message is still gone.
  #
  # Nor is it a durability lever. Whether a record survives a restart is a
  # router storage_manager responsibility (protocol-specification.md 6.3), not
  # something congestion_control can express: a record that must outlive the
  # moment belongs in a storage, and rides `background` — see scenario_event.
  #
  # express: true because something is blocked waiting on it. Batching would
  # add milliseconds to every tick, multiplied by every BLOCKING participant,
  # which is the latency argument `realtime` already uses express for.
  #
  # BLOCK stalls the publishing thread when the network cannot keep up, so this
  # is wrong for anything high-rate and wrong for anything a later message
  # supersedes.
  no_drop:
    priority: DATA_HIGH
    congestion_control: BLOCK
    reliability: RELIABLE
    express: true

  # Deferrable: raw passthrough, logging and audit trails. Correctness over
  # latency, lowest priority so it never crowds out live data.
  background:
    priority: DATA_LOW
    congestion_control: DROP
    reliability: RELIABLE
    express: false

default: default

# Only subjects whose stance differs from `default` are listed. The long tail
# of routine Timestamped* measurements inherits `default`.
subjects:

  # --- realtime: operator inputs on the tele-op hot path ---
  button_state_change: realtime
  joystick_x_pct: realtime
  joystick_y_pct: realtime
  joystick_z_pct: realtime
  joystick_rx_pct: realtime
  joystick_ry_pct: realtime
  joystick_rz_pct: realtime
  joystick_lt_pct: realtime
  joystick_rt_pct: realtime
  dpad_x_pct: realtime
  dpad_y_pct: realtime
  wheel_position_pct: realtime
  lever_position_pct: realtime
  # NB: actuator subjects (engine_throttle_pct, rudder_angle_deg, propeller_*)
  # are autopilot/engine telemetry, not operator inputs — they stay on
  # `default`. realtime is operator input devices only.

  # --- no_drop: losing one is a broken guarantee, not a degraded reading ---
  # A dropped acknowledgement stalls a barrier until it times out and fails a
  # run — the clock is waiting on this one. Low-rate by nature, one per tick
  # per participant, which is what makes back-pressure affordable here and
  # wrong nearly everywhere else.
  scenario_tick_ack: no_drop

  # --- transient: high-rate, short-lived frames ---
  image_raw: transient
  image_compressed: transient
  video_compressed: transient
  laser_scan: transient
  point_cloud: transient
  radar_spoke: transient
  radar_sweep: transient
  audio: transient

  # --- elevated: live conning state + vehicle state + safety-critical data ---
  location_fix: elevated
  navigation_target: elevated
  heading_true_north_deg: elevated
  heading_magnetic_deg: elevated
  course_over_ground_deg: elevated
  speed_over_ground_knots: elevated
  speed_through_water_knots: elevated
  nav_status: elevated
  vehicle_mode: elevated
  vehicle_armed: elevated
  vehicle_state: elevated
  fence_enabled: elevated
  alarm: elevated
  # Safety-critical situational data: collision-avoidance metrics and alerts.
  target_cpa_m: elevated
  target_tcpa_s: elevated
  target_bcr_m: elevated
  target_bct_s: elevated
  weather_alert: elevated
  # Grounding avoidance, the same stance as the collision-avoidance metrics
  # above: under-keel clearance is acted on in the moment, and a shed sample
  # matters as much here as a shed CPA.
  depth_below_transducer_m: elevated
  depth_below_keel_m: elevated
  depth_below_surface_m: elevated
  # An envelope breach is retained as evidence, but it is not a log entry: it
  # reports a condition that is true *now*, and the vessel is outside its
  # declared envelope while it stands. That puts it with `alarm` rather than
  # with route_change_event / warrant_record on `background`, which record
  # things that have already concluded.
  envelope_exceedance: elevated
  # Route execution: what the vessel is doing against the plan right now. The
  # plan artifacts themselves (route / voyage / route_signature) are edited at
  # human pace and inherit `default`; only the live execution view is elevated.
  route_status: elevated
  route_execution: elevated
  # The route edit lease. Low rate — the holder republishes every
  # heartbeat_interval_seconds (10) — but a receiver expires the lease on its
  # own clock when a heartbeat does not arrive (§6.5.1), so a dropped or
  # delayed heartbeat does not degrade the signal, it revokes the lease and
  # can hand the pen to someone else mid-edit. Latency-sensitive despite the
  # low rate, which is exactly what `elevated` is for.
  route_edit_authority: elevated
  route_edit_request: elevated

  # --- background: raw passthrough, logs, audit trails ---
  raw: background
  raw_json: background
  raw_nmea0183: background
  raw_nmea2000: background
  raw_lwe450: background
  log_message: background
  replay_status: background
  # The route-edit audit log: durable and append-only, so it must arrive, but
  # nothing waits on it — a late audit entry costs nothing.
  route_change_event: background

  # The justification audit stream: durable and append-only like the
  # route-edit log, and nothing waits on it — reconstruction reads it after
  # the fact.
  warrant_record: background

  # The scenario audit stream: what the exercise script did, and when. Same
  # class as the two above — durable and append-only, so it must arrive, but
  # nothing waits on it; an evaluator reads it after the run. Deliberately not
  # on `no_drop`: back-pressure is the price of something blocking on delivery,
  # and nothing blocks on this.
  scenario_event: background
  # NB: raw_rtcm_v3 is intentionally NOT here — RTK corrections feed positioning
  # and must not sit at the lowest priority; it inherits `default`.

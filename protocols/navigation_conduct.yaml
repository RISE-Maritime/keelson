# Protocol specification — see docs/protocol-specification.md §8.
# Source of truth for docs/protocols/navigation_conduct.md (generated).

name: navigation_conduct
title: Navigation conduct
status: proposed
depends_on: [command_authority]

purpose: |
  A vessel's navigation process — the one publishing `navigation_state` — sails
  whichever route edition its voyage pins, in whatever guidance order it has been
  given. This protocol says how it is told which, by whom, and in which order.
  `navigation_decisions` records what that process **decided** along the way; this
  one directs it.

  **Three things on the bus look like "sail this route", and they are different.**

  - `route_planner/v1.select_route` is about the **route artefact**: it advances a
    route's `RouteStatus` and bumps its edition (§6.4). It sails nothing.
  - Publishing a `voyage` is about the **intention**: a station says a voyage
    exists and which edition it pins.
  - `navigation_control/v1.load_route` is about **this vessel's conduct**: it tells
    the navigation process to take a named, immutable edition as its active voyage
    and to start navigating by it.

  `load_route` neither follows nor replaces `select_route`. It ignores
  `RouteStatus` entirely: it resolves the edition named in the `RouteRef`, never
  `latest`, and refuses a dangling one before anything moves. A deployment that
  wants selection recorded calls `select_route` first; one that does not, does not.

  **Why conduct is a call and not a publish.** `voyage/{voyage_id}` is a slot any
  station may write. Two stations activating different routes on one vessel is a
  read-modify-write race with no arbiter, and the loser finds out when the vessel
  sails the other one. Routing activation through the process that is doing the
  navigating leaves one writer, and lets it refuse a route it cannot resolve. While
  it serves `navigation_control/v1` it is the only writer of its vessel's voyage,
  and `Voyage.conducted_by` names it.

  **The conn holder directs; the process carries the orders out.** The operator
  holding the conn carries the master's responsibility and keeps it. While an
  operator holds a live `command_authority` lease and has ordered the process —
  `set_guidance_order` or `load_route` carrying that holder's token — the process
  acts on the vessel on the holder's behalf. It does not take the lease to do so:
  `NavigationState.conn_held` stays false, and `MODE_UNDERWAY` with
  `conn_held = false` means "carrying out the conn holder's order". A voyage the
  process merely finds selected is not an order.

  **Downward, it acts only through the vehicle interfaces.** Nothing here reaches
  an actuator. The process acts on the vessel by calling `vehicle_navigation/v1`
  and its siblings (the `act` action below), and only on a live lease: the
  operator's whose order it carries out, or its own.

  **Holding the conn is full automation.** Only when the process holds the lease
  itself does it take navigation decisions of its own: accepting collision-
  avoidance advice, rerouting. While an operator holds the conn, advice stays
  advice until the holder accepts it.

  **When it stands down.** It stops carrying out an order when the holder's lease
  lapses, when a station takes the helm mapping (that, and not another controller
  holding the lease, is what "manual" means), when the voyage the order was given
  for is no longer active, or on arrival. It reports `MODE_FALLBACK` and commands
  its safe state. Only a new order from the live conn holder re-arms it. The conn
  passing from one operator to another does not stop it: the order in force stays
  in force, now under the new holder.

  **The way back is a request, and the process must answer it.** This applies
  while the process holds the conn itself. A live lease cannot be seized, and a
  process that holds the conn heartbeats it for as long as it has a route, so it
  never lapses. An operator who handed the conn to the process takes it back by
  publishing a `command_request`; the process answers with `command_authority`'s
  directed `grant` to that requester, and stands down.

  Payloads: `Voyage`, `NavigationState`, `GuidanceOrder` (`messages/payloads/`).

roles:
  navigation_process:
    description: >
      The process holding the vessel's navigation function under automation. Serves
      `navigation_control/v1`, writes the voyage slot while it does, publishes
      `navigation_state`, and calls the vehicle interfaces while it carries out the
      conn holder's order, or holds the conn itself (full automation).
    reads: [command_authority, command_request, operational_authority, route, route_execution]
  director:
    description: >
      Whoever directs it: the operator holding the conn, a scenario runner in
      simulation, a conduct service under a grant. Calls the interface. Publishes a
      voyage only before conduct begins, to plan one.
    reads: [navigation_state, voyage, command_authority]
  conn_holder:
    description: >
      The holder of the live `command_authority` lease — normally the operator at a
      station, who keeps it and with it the responsibility; the navigation process
      itself only under full automation. The vessel is acted on under this role's
      authority only: by the holder's own helm mapping, or by the navigation process
      carrying out the holder's order.
    reads: [command_authority]

# One process may hold several roles: a navigation process that holds the conn is
# its own conn holder (full automation). They stay separate on the wire.

keys:
  - subject: voyage
    payload: keelson.Voyage
    key: "{voyage_id}"
    shape: slot
    storage: latest
    writer_field: conducted_by
    rate: one key per voyage, restated in full on every status change
  - subject: navigation_state
    payload: keelson.NavigationState
    key: "{producer}"
    shape: instance
    storage: none
    rate: 1 Hz, latest wins

key_notes: |
  **Why `voyage` is a slot.** §6.3's as-built table calls `voyage/{voyage_id}` an
  instance key, but §2.1.1's definition of a slot — one position that is
  overwritten, no producer chunk in the key, the current writer in the payload —
  is what this key has always been. The label predates §2.1.1; the wire key is
  unchanged. `Voyage.conducted_by` is the writer field §2.1.1 requires, and it is
  empty until a navigation process takes the voyage up.

  **Every voyage record restates the whole voyage**, so the store's last value is
  complete. The slot is backed by storage; `navigation_state` is not persisted.

  **`navigation_state` is keyed by producer alone.** Two processes navigating the
  same vessel write different keys, and neither is a lock: see the invariants.

actions:
  # directing — navigation_control/v1, served by the navigation process
  load_route:
    by: director
    rpc: navigation_control/v1
    note: >
      Makes a route edition this vessel's active voyage and takes up a guidance
      order. A RouteRef names no entity, so an edition drawn for another vessel is
      republished unchanged under this one first — same route_id, same edition,
      because editions are immutable. Mints a voyage_id, or re-pins the one named
      (a reroute).
  set_guidance_order:
    by: director
    rpc: navigation_control/v1
    note: >
      Track (optionally resuming from a waypoint id), course over ground, heading
      or hold, with an optional speed. TEMPORARILY_REJECTED when there is no
      active voyage to steer.
  set_voyage_status:
    by: director
    rpc: navigation_control/v1
    note: >
      Pause, resume, complete or abort the active voyage. PLANNED is refused: a
      voyage is planned by publishing it, not by asking the process sailing it.
  get_navigation_state:
    by: director
    rpc: navigation_control/v1
    note: >
      The current NavigationState, for a caller that cannot wait for the next 1 Hz
      broadcast. Reads nothing else and needs no authority.

  # voyage — the process is the slot's only writer while it serves the interface
  plan:
    by: director
    publish: voyage
    sets: {status: VOYAGE_STATUS_PLANNED}
    note: >
      The one voyage write the navigation process does not make. Planning is
      publishing; conduct is calling. `conducted_by` is empty until a process
      takes the voyage up.
  activate:
    by: navigation_process
    publish: voyage
    sets: {status: VOYAGE_STATUS_ACTIVE}
    note: >
      Caused by load_route. Pins the edition and sets `conducted_by` to this
      process. Republished on a reroute with a new `route_ref` and an appended
      audit entry.
  pause:
    by: navigation_process
    publish: voyage
    sets: {status: VOYAGE_STATUS_PAUSED}
    note: Caused by set_voyage_status. The voyage stands; the process stops navigating by it.
  resume:
    by: navigation_process
    publish: voyage
    sets: {status: VOYAGE_STATUS_ACTIVE}
    note: Caused by set_voyage_status. Back to the guidance order in force when it paused.
  complete:
    by: navigation_process
    publish: voyage
    sets: {status: VOYAGE_STATUS_COMPLETED}
    note: Caused by set_voyage_status, or by the process reaching the last waypoint.
  abort:
    by: navigation_process
    publish: voyage
    sets: {status: VOYAGE_STATUS_ABORTED}
    note: Caused by set_voyage_status. Terminal; a new voyage is a new voyage_id.

  # navigation_state — one publish action per mode, so the lifecycle can name
  # which one makes each transition.
  report_idle:
    by: navigation_process
    publish: navigation_state
    sets: {mode: MODE_IDLE}
  report_ready:
    by: navigation_process
    publish: navigation_state
    sets: {mode: MODE_READY}
    note: >
      Also where it sits while the conn holder has not ordered it: it monitors and
      commands nothing until the holder's order, or a directed grant of the conn.
  report_underway:
    by: navigation_process
    publish: navigation_state
    sets: {mode: MODE_UNDERWAY}
    note: sub_mode refines this mode and no other; see the sub_mode lifecycle below.
  report_fallback:
    by: navigation_process
    publish: navigation_state
    sets: {mode: MODE_FALLBACK}
  report_arrived:
    by: navigation_process
    publish: navigation_state
    sets: {mode: MODE_ARRIVED}
  report_ended:
    by: navigation_process
    publish: navigation_state
    sets: {mode: MODE_ENDED}
    note: Reachable from any mode.

  # the guidance order in force, restated in navigation_state.guidance_order
  report_track:
    by: navigation_process
    publish: navigation_state
    sets: {sub_mode: SUB_MODE_TRACK}
    note: Following the planned track of the pinned edition. The order is GuidanceOrder.track.
  report_steering:
    by: navigation_process
    publish: navigation_state
    sets: {sub_mode: SUB_MODE_STEERING}
    note: >
      Holding an ordered course over ground or heading, off the track. The two are
      different instructions and are never substituted for each other: in any
      current they differ by the drift angle.
  report_holding:
    by: navigation_process
    publish: navigation_state
    sets: {sub_mode: SUB_MODE_HOLDING}
    note: Stopped or loitering on an order, not on a fault. The order is GuidanceOrder.hold.

  # acting — the one step that reaches the vessel
  act:
    by: navigation_process
    rpc: vehicle_navigation/v1
    note: >
      set_steering_order and set_cruise_speed, as the guidance order in force
      requires, on the authority of the live conn holder: the operator whose order
      it carries out, or the process itself under full automation. This step acts;
      every other action here only directs or reports.

lifecycle:
  - subject: voyage
    payload: keelson.Voyage
    states:
      - {name: planned, field: status, is: VOYAGE_STATUS_PLANNED}
      - {name: active, field: status, is: VOYAGE_STATUS_ACTIVE}
      - {name: paused, field: status, is: VOYAGE_STATUS_PAUSED}
      - {name: completed, field: status, is: VOYAGE_STATUS_COMPLETED}
      - {name: aborted, field: status, is: VOYAGE_STATUS_ABORTED}
    transitions:
      - {to: planned, action: plan}
      - {to: active, action: activate, note: "From planned, or straight from a load_route that mints the voyage_id."}
      - {from: active, to: active, action: activate, note: "A reroute: the same voyage re-pinned to a new edition."}
      - {from: active, to: paused, action: pause}
      - {from: paused, to: active, action: resume}
      - {from: active, to: completed, action: complete}
      - {from: active, to: aborted, action: abort}
      - {from: paused, to: aborted, action: abort}

  - subject: navigation_state
    payload: keelson.NavigationState
    of: mode
    states:
      - {name: idle, field: mode, is: MODE_IDLE}
      - {name: ready, field: mode, is: MODE_READY}
      - {name: underway, field: mode, is: MODE_UNDERWAY}
      - {name: fallback, field: mode, is: MODE_FALLBACK}
      - {name: arrived, field: mode, is: MODE_ARRIVED}
      - {name: ended, field: mode, is: MODE_ENDED}
    transitions:
      - {to: idle, action: report_idle}
      - {from: idle, to: ready, action: report_ready}
      - {from: ready, to: underway, action: report_underway, note: "A voyage is active and either the live conn holder has ordered it (load_route, set_guidance_order) or it holds the conn itself."}
      - {from: underway, to: ready, action: report_ready, note: "set_voyage_status paused the voyage."}
      - {from: underway, to: fallback, action: report_fallback, note: "It stands down: the conn holder's lease lapsed, a station took the helm mapping, it granted its own conn away on request, or an input it needs went stale."}
      - {from: fallback, to: ready, action: report_ready, note: "A new order from the live conn holder, or a directed grant of the conn. Never the order or the token it fell back on."}
      - {from: fallback, to: underway, action: report_underway}
      - {from: underway, to: arrived, action: report_arrived}
      - {from: arrived, to: ended, action: report_ended, note: "Under an operator's conn there is no conn to release, so it ends at once."}
      - {from: idle, to: ended, action: report_ended}
      - {from: ready, to: ended, action: report_ended}
      - {from: underway, to: ended, action: report_ended}
      - {from: fallback, to: ended, action: report_ended}

  - subject: navigation_state
    payload: keelson.NavigationState
    of: sub_mode
    states:
      - {name: on_track, field: sub_mode, is: SUB_MODE_TRACK}
      - {name: steering, field: sub_mode, is: SUB_MODE_STEERING}
      - {name: holding, field: sub_mode, is: SUB_MODE_HOLDING}
    transitions:
      - {to: on_track, action: report_track}
      - {from: on_track, to: steering, action: report_steering}
      - {from: steering, to: on_track, action: report_track, note: "The hand-back: GuidanceOrder.track, resuming from a waypoint id or from the leg the process judges current."}
      - {from: on_track, to: holding, action: report_holding}
      - {from: steering, to: holding, action: report_holding}
      - {from: holding, to: on_track, action: report_track}
      - {from: holding, to: steering, action: report_steering}

# sub_mode refines MODE_UNDERWAY only and is UNSPECIFIED in every other mode.
# SUB_MODE_AVOIDING and SUB_MODE_REROUTING are the same field; what drives them is
# navigation_decisions and a reroute, not a guidance order, so they are not states here.

flows:
  load_a_route:
    description: A route edition becomes this vessel's active voyage and it takes up the track.
    steps:
      - {action: plan, note: "Optional. A station publishes the voyage PLANNED before anyone conducts it."}
      - {action: load_route, guard: "the caller's token matches the live lease, or the process holds the conn and its deployment permits the controller_id"}
      - {action: activate, note: "The edition resolved; conducted_by names this process."}
      - {action: report_underway}
      - {action: report_track}
      - {action: act, guard: "a live command_authority lease on its own clock: the caller's, whose order it carries out, or its own"}
  steer_off_the_track:
    description: An operator steers by course or heading for a while, then hands the track back.
    steps:
      - {action: set_guidance_order, note: "Course over ground or heading, with an optional speed."}
      - {action: report_steering}
      - {action: act}
      - {action: set_guidance_order, note: "GuidanceOrder.track again, optionally naming the waypoint to rejoin at."}
      - {action: report_track}
  carry_out_the_holders_order:
    description: The operator keeps the conn and orders the process; it carries the order out without taking the lease.
    steps:
      - {action: report_ready, note: "A voyage is active and the operator holds the conn. It monitors and commands nothing: finding a voyage selected is not an order."}
      - {action: set_guidance_order, role: director, guard: "the caller's token matches the live lease, and the lease is not this process's", note: "Or load_route. The operator keeps the conn."}
      - {action: report_underway, note: "conn_held stays false. The reason names whose order it is carrying out."}
      - {action: act, note: "On the operator's lease. Advice stays advice: it accepts none on its own under an operator's conn."}
      - {action: report_underway, note: "The conn passes to another operator. The order in force stays in force, under the new holder."}
      - {action: report_fallback, note: "The holder's lease lapsed, or a station took the helm mapping. It commands its safe state."}
      - {action: set_guidance_order, role: director, note: "Only a new order from the live conn holder re-arms it."}
      - {action: report_ready}
      - {action: report_underway}
      - {action: act}
  an_operator_takes_the_conn_back:
    description: Under full automation, an operator asks the process for the conn; it grants it and stands down.
    steps:
      - {action: report_underway, note: "Navigating and acting, holding the conn."}
      - {action: report_fallback, note: "An operator published a command_request (command_authority `request`), and the process answered with command_authority's `grant`: a fresh token naming the requester's controller_id and controller_site as requested. It stands down, hands back any actuation it installed, and commands its safe state; the voyage stays ACTIVE and the guidance order stays in force."}
      - {action: get_navigation_state, role: director, note: "The operator, now holding the conn, can read what it was doing."}
      - {action: set_guidance_order, role: director, note: "A new order from the operator, who keeps the conn, resumes it under the operator's conn (carry_out_the_holders_order). A directed grant back resumes full automation."}
      - {action: report_ready}
      - {action: report_underway}
      - {action: act}
  pause_and_abort:
    description: The voyage is paused and later abandoned.
    steps:
      - {action: set_voyage_status, note: PAUSED.}
      - {action: pause}
      - {action: report_ready}
      - {action: set_voyage_status, note: "ABORTED, with a reason for the audit trail."}
      - {action: abort}
      - {action: report_ended}

invariants:
  - >-
    `Caller.authority_token` is an interlock, not a credential.
    `CommandAuthority.token` is broadcast on a stored slot that every observer
    reads, so holding it proves nothing about who is calling. It proves only that
    the caller has heard the current lease — which is what stops a station that
    has silently lost the conn from going on issuing orders. The responder checks
    the token **and** `controller_id` against the lease it has heard, and judges
    expiry on its own clock (§6.5.1), never by comparing timestamps. Anything
    needing a real access boundary must not rely on this.
  - >-
    While the navigation process serves `navigation_control/v1` it is the only
    writer of its vessel's `voyage` slot, and `Voyage.conducted_by` names it. A
    station may publish a voyage PLANNED before that; it does not write the slot
    afterwards.
  - >-
    `load_route` resolves the edition named in the `RouteRef` and never `latest`.
    A dangling edition is refused before anything moves. Editions are immutable,
    so an edition copied from another vessel's tree keeps the source `route_id`
    and edition number and the lineage stays readable.
  - >-
    Nothing in this protocol reaches an actuator. The navigation process acts on
    the vessel only through the vehicle interfaces (`act`), and only on a live
    `command_authority` lease by its own clock: the operator's whose order it
    carries out, or its own.
  - >-
    The conn holder directs and the navigation process carries out. An operator
    holding the conn keeps it while the process carries out the operator's order;
    the process does not take the lease for that. It carries out only an order
    given by the live holder's token (`load_route`, `set_guidance_order`) since it
    last stood down — a voyage it finds selected is not one — and it stands down to
    `MODE_FALLBACK` when the holder's lease lapses, a station takes the helm
    mapping, or the voyage ends. A handover of the conn between operators keeps the
    order in force under the new holder.
  - >-
    Holding the conn is full automation. Only a process that holds the lease
    itself takes navigation decisions of its own — accepting collision-avoidance
    advice, rerouting. Under an operator's conn, advice stays advice until the
    holder accepts it.
  - >-
    A navigation process that holds the conn (full automation) answers an operator's
    `command_request` with a directed `grant` (command_authority). That protocol
    lets a holder ignore a request, and a live lease cannot be seized, so a
    process that heartbeats for as long as it has a route and ignores requests
    keeps the conn from every station for good — handing it the conn becomes
    one-way. It may decline a request from another automated controller; an
    operator's it grants.
  - "Taking the conn is not a mode, and neither is manual. There is no manual guidance order: manual is a station taking the helm mapping, and it stands the process down (`MODE_FALLBACK`) until the conn holder orders it again."
  - "`hold` is a guidance order, not only what FALLBACK does. `SUB_MODE_HOLDING` on an order and `MODE_FALLBACK` on a fault are different states and are not merged."
  - "A guidance order names its frame by which field it sets. Course over ground and heading are never substituted for each other, and an order the responder cannot hold is `UNSUPPORTED`, never approximated."
  - "`NavigationState.guidance_order` restates the order in force, whether or not the process is acting on it. It is absent when there is no voyage."
  - "`NavigationState.conn_held` means the process holds the lease itself (full automation), nothing more. `MODE_UNDERWAY` with `conn_held = false` is carrying out the conn holder's order."
  - "ACCEPTED means recorded, not done. Whether the vessel then does it is what `navigation_state`, `route_execution` and the vehicle's own telemetry say afterwards."
  - "`NavigationState.authority_level_in_force` uses the same enum as `OperationalAuthority`, and `UNKNOWN` does not authorise anything."
  - >-
    `NavigationState` overlaps `RouteExecution` (`voyage_id`, `route_ref`,
    `current_leg_from_waypoint_id`) on purpose: they come from different
    producers. `NavigationState` is not a lock or a grant. A consumer deciding
    whether to act reads `command_authority` and `operational_authority`, never
    `navigation_state`.
  - The proto default (`*_UNSPECIFIED = 0`) is never a state.

not_solved: |
  **Where `Caller` lives.** It is declared in `NavigationControl.proto` because
  this is the only interface that takes a lease token. When a second one needs the
  same shape, it moves to a common file — not before.

  **Copying an edition across vessel trees** is described in `load_route`, not
  modelled as an action: `route` is claimed by no protocol yet (§6 has not been
  migrated), and an action may only publish a subject its own protocol keys.

  **Two navigation processes on one vessel.** Their `navigation_state` keys keep
  them apart and the voyage slot has one writer field, but nothing arbitrates
  which of them should be conducting.

  **Migrating the as-built §6 instance keys** to carry a producer chunk.

# Protocol specification — see docs/protocol-specification.md §8.
# Source of truth for docs/protocols/command_authority.md (generated).

name: command_authority
title: Command authority
status: proposed
depends_on: []

purpose: |
  Who holds which **role** over a vessel, on what terms, and how a role moves.
  `command_authority` began as one thing — the conn, a cooperative single-writer
  lease at slot `{vessel_id}` — and it still is that: a record with no `role`
  reads as the conn lease, and nothing built so far changes its meaning. What
  this revision adds is the ability to **split command** across the roles a
  bridge has always had, each on its own slot, each orthogonal to the others.

  It is still not a security boundary. It stops two well-behaved stations from
  colliding and stops nothing else; the Zenoh ACL, the principal binding and
  signing are the boundary. It composes with `operational_authority` (the
  vessel's own veto on accepting remote control) and with `safety_state`
  (`emergency_request` protocol), which sits **above** every role here: no record
  in this protocol authorises anything while the vessel is not CLEAR.

  **The roles, and their slots.** One holder per role per vessel — per payload
  for PAYLOAD_AUTHORITY, and per *function* for NAVIGATION_AUTHORITY.

  | Role | Slot | Kind | Held by |
  | --- | --- | --- | --- |
  | `ROLE_CONN` | `{vessel_id}` | lease | an operator at the active control station, or the navigation process |
  | `ROLE_OVERALL_COMMAND` — the master | `{vessel_id}/overall` + `/session` | assignment + session | a person at any ROC site. **Never software.** |
  | `ROLE_NAVIGATIONAL_COMMAND` — SARUMS's Controller | `{vessel_id}/navigational` + `/session` | assignment + session | a person. **Never software.** |
  | `ROLE_NAVIGATION_AUTHORITY` | `{vessel_id}/navigation` | assignment document | per function: a person, or the navigator from control method 3 up |
  | `ROLE_ENGINEER` | `{vessel_id}/engineer` | lease | an operator at any site, or an onboard plant process |
  | `ROLE_PAYLOAD_AUTHORITY` | `{vessel_id}/payload/{payload_id}` | lease, one per payload | an operator, or a payload process |

  Maintenance is **not a role**: it is a change procedure with a state machine of
  its own (`maintenance_state`, a later protocol). Control execution is not a
  role either: it is the `vehicle_control/v1` mapping — you hold the conn, you
  do not hold the helm (`ControlMapping`).

  **Assignment and session are two records, not one.** Who is the master is a
  stored **assignment** with no TTL, changed only by procedure, by grant or by
  ASSUME_COMMAND. Whether the master is present and reachable is a **session**
  lease on the sibling `/session` slot, heartbeated by the assignee and naming
  the assignment it belongs to. Losing the session alarms and trips the gate's
  control-link watchdog; it never vacates the assignment. Responsibility does
  not expire because a browser crashed: the vessel says "master unreachable",
  not "no master".

  **Functional authority produces decisions; only the conn holder resolves them
  into motion.** NAVIGATION_AUTHORITY is one atomic document with a holder per
  navigation function at one of SARUMS's five control methods
  (`NavigationAuthority`). It carries **no motion fence** and no TTL of its own:
  a lapsed holder makes *that function* fall back per its envelope's
  `comms_loss_behaviour`; the document and the other functions stand. A held
  function at method 3 or above lets the navigator *decide*; the decision reaches
  the helm either under the navigator's own conn (full automation) or through the
  conn holder — carried out inside a pre-authorised envelope, or ordered as
  method-2 advice — and never a third way (`navigation_conduct`).

  **A motion transfer is two-phase, durable, and the gate mints the fence.** The
  onboard authority manager never names a fence. It records PREPARED, sends
  `TransferPrepare {transfer_id, mappings, active_control_station,
  prepare_ttl_ms}`; the gate validates against what it is emitting **now** —
  every source fresh, neutral or matched, the mode allowing — **reserves
  `(T, n+1)`** and answers `TransferAck {proposed_fence}`; the manager durably
  records COMMITTED(map, station, fence) and publishes `TransferCommit`; the gate
  activates and persists the fence. The manager checking alone would be a
  time-of-check / time-of-use race: the lever moves between the check and the
  switch. When authority must change with no manager alive — a lapsed conn, an
  invalid source, an abort, a required local fallback — **the gate increments
  the generation itself**, enters the configured transition state, and the
  manager reconciles afterwards. A manager restart mints nothing and interrupts
  no healthy conn.

  ```mermaid
  stateDiagram-v2
      [*] --> Available
      Available --> Requested: request (a role holder)
      Requested --> Validating: lease + role + profile checked by the manager
      Validating --> Proposed: manager records PREPARED, sends TransferPrepare
      Validating --> Rejected: no lease · wrong role · mode forbids · stale revision
      Proposed --> Activating: gate validates (fresh ∧ neutral or matched ∧ mode), reserves (T, n+1), ACKs proposed_fence
      Proposed --> Rejected: gate NAKs — stale · not neutral · mode forbids · proposal expired
      Activating --> Active: manager records COMMITTED, publishes TransferCommit; gate activates, persists the fence
      Active --> Releasing: explicit release
      Active --> Fault: source stale · lease lapsed · safety action
      Releasing --> Available: fallback acknowledged
      Fault --> Activating: configured fallback exists (gate increments alone)
      Fault --> SafeState: no fallback
      SafeState --> Available: recovery + explicit re-arm
      Rejected --> Available
  ```

  **No seizure between humans; intervention against automation.** One station
  never displaces another mid-manoeuvre except by grant, and an unresponsive
  human is recovered by expiry (a lease) or by ASSUME_COMMAND (an assignment).
  Against automation the rule is different: the human in charge must always be
  able to intervene, and a navigator that has stopped answering must not hold
  the conn until its lease lapses. **Take control** — the human source is ready:
  one atomic commit of `active_control_station`, the human motion map and a new
  fence. **Abort automation** — urgent, nobody ready: the gate fences the
  automation at once and enters the configured transition state, never an
  implicit "no source selected". Neither waits for the navigator's
  `yield_on_request`, which stays as the polite path.

  **Migration is a profile, not an inference.** Under the
  `LEGACY_SINGLE_OPERATOR` command profile — stated on the vessel's registry
  entry, never deduced from a missing lease — the authority manager
  *synthesises* the OVERALL_COMMAND and NAVIGATIONAL_COMMAND assignments for
  the conn holder and publishes them with `assignment.synthesised = true`, so
  the top bar shows three holders with one name and the record says why.

  **The assignments, projected.** The manager also publishes one
  `command_assignment/{vessel_id}` — the current OVERALL and NAVIGATIONAL
  `{assignee, assignment_id, revision}` and itself as issuer — on every change
  and at a heartbeat. It is the feed the safety supervisor checks a RESET's
  assignment against without ever asking the manager (`emergency_request`).

  Payloads: `CommandAuthority`, `CommandRequest`, `CommandAssignment`, `Fence`, `NavigationAuthority`,
  `ControlMapping` / `TransferPrepare` / `TransferAck` / `TransferCommit`,
  `GuidanceCandidate` (`messages/payloads/`). Design: crowsnest-dev
  `docs/COMMAND-ARCHITECTURE.md` §0, §1, §4, §5.

roles:
  holder:
    description: >
      Whoever holds a LEASE role right now — the conn, the engineer, a payload
      authority — or a SESSION. Publishes the record, heartbeats it, releases
      it, grants it.
  claimant:
    description: >
      A station or process that wants a role and does not have it. Publishes a
      request; takes a lease only once no unexpired lease exists; is granted an
      assignment by the holder or the manager.
  assignee:
    description: >
      The person assigned OVERALL_COMMAND or NAVIGATIONAL_COMMAND. Writes the
      assignment record (the master sets responsible_roc and
      active_control_station on it), heartbeats the session beside it, grants
      other roles, and requests take-control or abort-automation.
  authority_manager:
    description: >
      The onboard authority manager, exactly one per vessel. Records
      assignments and successions, synthesises the legacy profile's
      assignments, proposes transfers to the gate (never a fence), writes the
      lease that a committed transfer produced, reconciles with the gate on
      restart, and keeps the audit record.
    reads: [command_authority, command_request, operational_authority]
  control_gate:
    description: >
      The onboard motion gate. Owns both halves of the motion fence: ACKs or
      NAKs a proposal against what it is emitting now, activates only on
      COMMIT, increments alone when it must act without the manager. Judges
      every lease on its own clock.
    reads: [command_authority, safety_state]
  observer:
    description: >
      Anything that reads a record before acting or displaying — a vessel-side
      RPC server, an operator UI, a recorder. Decides expiry on its own clock.
    reads: [operational_authority]


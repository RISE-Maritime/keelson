site_name: keelson
site_url: https://RISE-Maritime.github.io/keelson
repo_url: https://github.com/RISE-Maritime/keelson

# Not pages: the agent instructions file and the literate-nav sidebar spec.
exclude_docs: |
  CLAUDE.md
  SUMMARY.md

nav:
 - Home: index.md
 - Protocol specification: protocol-specification.md
 - Well-known subjects and types: subjects-and-types.md
 - Interfaces: interfaces.md
 - Protocols: protocols/
 - Health Monitoring: health-monitoring.md
 - How to use: how-to-use.md
 - Existing resources: existing-resources.md

theme:
  name: material
  # Only for overrides/main.html, which fills in Material's `outdated` block.
  # That block is empty by default, so `extra.version.default` below would
  # otherwise be a setting that silently shows nothing.
  custom_dir: overrides
  features:
    - navigation.indexes
  palette:
    scheme: slate
    primary: blue grey
    accent: deep orange
  icon:
    logo: fontawesome/solid/hexagon-nodes-bolt

# The Protocols section is generated: generate_docs.sh writes one page per
# protocols/*.yaml plus docs/protocols/SUMMARY.md, which literate-nav reads
# for that section's sidebar so mkdocs.yml never has to list the pages.
plugins:
  # Listed here rather than left to `mike deploy` to inject: injection
  # round-trips this file through PyYAML, which would have to dump and reload
  # the `!!python/name:` tag below. With the Material theme the plugin is
  # otherwise near-inert -- mike ships no `material` entry point, so it adds no
  # version-selector assets of its own. The switcher comes from `extra.version`.
  - mike:
      # Point every canonical link at /latest/ so search engines do not split
      # ranking across 0.6/, 0.7/, ... or index a version already superseded.
      canonical_version: latest
  - search
  - literate-nav:
      nav_file: SUMMARY.md
      implicit_index: true

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

# Published by mike, one copy of the site per release under /<major>.<minor>/
# with `latest` as a moving alias (see the `docs` job in
# .github/workflows/release.yml). `provider: mike` makes the theme fetch
# ../versions.json at runtime and render the switcher; `default: latest` names
# the alias that counts as current, so every other version shows the
# outdated-version banner; `alias: true` prints "0.6 (latest)" in the dropdown
# rather than a bare "0.6".
extra:
  version:
    provider: mike
    default: latest
    alias: true

extra_javascript:
  - assets/glightbox.min.js
  - assets/init.js

extra_css:
  - assets/glightbox.min.css

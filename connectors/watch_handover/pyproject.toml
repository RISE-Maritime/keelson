[project]
name = "keelson-connector-watch-handover"
version = "0.0.0"
description = "Vessel-side confirmation of a ROC watch handover, from operational_authority"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["watch_handover*"]

[tool.uv.sources]
keelson = { workspace = true }

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

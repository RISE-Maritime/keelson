# A minimal claim graph exercising every construct: two receivers in a
# redundancy group ground a position claim (licensed on both, weakened on
# one), navigation requires position and heading at full strength, and
# the ladder maps the surviving set to an authority level. Ladder rung
# names must be AuthorityLevel names (without the AUTHORITY_LEVEL_
# prefix) so the determination publishes as OperationalAuthority, and the
# last rung is the floor and must be unconditional.
evidence_max_age_s: 5.0
requalification_hold_s: 10.0
snapshot_period_s: 10.0

claims:
  gnss_fix:
    tier: component
    statement: "the main GNSS receiver provides usable position fixes"
    warrant: "a fix stream at nominal rate supports navigation-grade positioning"
    backing: "receiver validation; bands in the entity_health configuration"
    rebuttals:
      - id: fix_stream_not_nominal
        description: "the fix stream is below nominal"
        when: {source: gnss, subject: location_fix, level_below: NOMINAL}

  gnss_aux_fix:
    tier: component
    statement: "the auxiliary GNSS receiver provides usable position fixes"
    warrant: "a fix stream at nominal rate supports navigation-grade positioning"
    backing: "receiver validation; bands in the entity_health configuration"
    rebuttals:
      - id: fix_stream_not_nominal
        description: "the fix stream is below nominal"
        when: {source: gnss_aux, subject: location_fix, level_below: NOMINAL}

  compass_heading:
    tier: component
    statement: "the compass provides a usable heading"
    warrant: "a heading stream at nominal rate supports course keeping"
    backing: "compass calibration; bands in the entity_health configuration"
    rebuttals:
      - id: heading_stream_not_nominal
        description: "the heading stream is below nominal"
        when: {source: compass, subject: heading_true_north_deg, level_below: NOMINAL}

  position:
    tier: intermediate
    statement: "own position is known to navigation grade"
    warrant: >-
      two independently licensed receivers support the claim at full
      strength; a single licensed receiver supports it at reduced strength
    backing: "redundancy argument"
    grounds:
      redundancy:
        members: [gnss_fix, gnss_aux_fix]
        min_licensed: 1

  navigation:
    tier: function
    statement: "the vessel can navigate"
    warrant: "navigation requires position and heading at full strength"
    backing: "function validation"
    grounds:
      edges:
        - {claim: position, requires: LICENSED}
        - {claim: compass_heading, requires: LICENSED}

autonomy_ladder:
  - name: FULL_AUTONOMOUS
    requires: {navigation: LICENSED}
  - name: SUPERVISED_REMOTE
    requires: {position: WEAKENED}
  - name: MINIMAL_SAFE_MODE
    requires: {}

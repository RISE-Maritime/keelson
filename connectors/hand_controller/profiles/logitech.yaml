name: logitech
description: Logitech F310/F710 Gamepad (DirectInput mode, switch on "D")

axis_map:
  0: joystick_x_pct
  1: joystick_y_pct
  2: joystick_rx_pct
  3: joystick_ry_pct
  4: dpad_x_pct
  5: dpad_y_pct

button_name_map:
  0: x
  1: a
  2: b
  3: y
  4: lb
  5: rb
  8: back
  9: start
  10: l3
  11: r3

# Digital triggers — published as axis values (0.0 or 100.0).
# A value is a subject (the input name is then the subject too), or
# {subject, input}. The two triggers are one quantity on two devices, so both
# publish trigger_position_pct and the input name is the source-id's last
# chunk: logitech/left_trigger and logitech/right_trigger (keelson protocol
# spec §2.1.2).
button_to_axis:
  6: {subject: trigger_position_pct, input: left_trigger}
  7: {subject: trigger_position_pct, input: right_trigger}

# Logitech has no shift modifier
shift_button: null
shift_map: {}

[project]
name = "keelson-connector-screen"
version = "0.0.0"
description = "Screen capture connector for Keelson (monitor or window, cross-platform)"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.uv.sources]
keelson = { workspace = true }

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

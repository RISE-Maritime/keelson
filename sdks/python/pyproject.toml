[project]
name = "keelson"
# NOT the published version. The release workflow overwrites this from the
# release tag (`uv version --frozen`), so the tag and the artifact cannot
# disagree. This value only matters for local installs; do not hand-bump it
# before tagging — that manual step is what broke release 0.5.4.
version = "0.5.3"
description = "A Python Software Development Kit for Keelson"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Fredrik Olsson", email = "fredrik.x.olsson@ri.se" }
]
maintainers = [
    { name = "Fredrik Olsson", email = "fredrik.x.olsson@ri.se" }
]

dependencies = [
    "eclipse-zenoh>=1.2.1",
    # Floor: never below the protobuf whose protoc generated the bundled
    # *_pb2.py files (protoc 30.2 -> 6.30.2); older runtimes refuse to import
    # them, and test_protobuf_compat.py fails if regenerated code needs more.
    # 6.31.0 because it added FieldDescriptor.is_repeated, the only way to ask
    # that which also works on 7.x (7 removed FieldDescriptor.label).
    # Ceiling: the next major is untested; raise it after CI passes on it.
    "protobuf>=6.31.0,<8",
    "pyyaml",
    "parse",
]

[project.urls]
Homepage = "https://github.com/RISE-Maritime/keelson"
Repository = "https://github.com/RISE-Maritime/keelson"
Documentation = "https://rise-maritime.github.io/keelson/"

[project.entry-points."zenoh_cli.codecs.encoders"]
"keelson-enclose-from-text" = "keelson.codec:enclose_from_text"
"keelson-enclose-from-base64" = "keelson.codec:enclose_from_base64"
"keelson-enclose-from-json" = "keelson.codec:enclose_from_json"

[project.entry-points."zenoh_cli.codecs.decoders"]
"keelson-uncover-to-text" = "keelson.codec:uncover_to_text"
"keelson-uncover-to-base64" = "keelson.codec:uncover_to_base64"
"keelson-uncover-to-json" = "keelson.codec:uncover_to_json"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["keelson"]

[tool.hatch.build.targets.sdist]
include = [
    "keelson/**/*.py",
    "keelson/**/*.pyi",
    "keelson/**/*.yaml",
    "keelson/**/*.bin",
]

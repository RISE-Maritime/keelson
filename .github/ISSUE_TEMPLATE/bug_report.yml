name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can it be reproduced?
      description: Commands, configuration and log output. Please remove credentials.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Keelson version or image tag, and the connector or SDK concerned.
    validations:
      required: true

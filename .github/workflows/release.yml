name: Release

# Three entry points, one version grammar.
#
#   release: published    A human cuts an integration (`0.6.0-pre.12`) or stable
#                         (`0.6.0`) release from the GitHub UI.
#   workflow_dispatch     channel=alpha: a build of one open PR's head. Computes
#                         the next `X.Y.Z-alpha.<pr>.dev.<n>`, pushes that tag
#                         for the record, and publishes it in the same run.
#                         channel=experimental: origin/dev plus every open PR
#                         against dev, merged in PR-number order, published as
#                         `X.Y.Z-experimental.<n>`. Fails closed on a merge
#                         conflict. Manual on purpose: an automatic build per
#                         push meant a registry version per docs commit.
#   push: tags '*-alpha.*'  The same alpha publish, for a tag pushed by hand.
#                         This is also the only route that works from a branch
#                         that has not reached the default branch yet, which is
#                         how this workflow was first tested. (A dispatch can
#                         also be pointed at a branch with `--ref`; the workflow
#                         file only has to exist on the default branch.)
#
# Alpha and experimental builds are deliberately NOT GitHub Releases. They land
# several times a day, and the Releases page is a list of releases.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      channel:
        description: "alpha: one PR's head. experimental: dev plus every open PR."
        required: true
        type: choice
        options: [alpha, experimental]
        default: alpha
      pr:
        description: "PR number to build (alpha only)"
        required: false
        type: string
      base_version:
        description: "Base version (default: derived from the newest -pre tag)"
        required: false
        type: string
  push:
    tags:
      - '*-alpha.*'

permissions:
  id-token: write       # Required for OIDC (npmjs, PyPI)
  contents: write       # allow the alpha/experimental tag to be pushed
  packages: write       # allow GITHUB_TOKEN to publish packages
  pull-requests: write  # let an experimental build comment on the PR it failed to merge

# Experimental builds serialise on one group. Two dispatches a minute apart
# would otherwise race on the serial and on the registries; queued, the second
# run recomputes the tree from the then-current heads and, if the first already
# published it, exits on the tree-hash gate. Never cancel a run in progress:
# a publish interrupted between PyPI and npm is a half-shipped version.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' && inputs.channel == 'experimental') && 'experimental' || github.run_id }}
  cancel-in-progress: false

jobs:

  # The release tag is the single source of truth for the published version.
  #
  # It did not used to be: this workflow published whatever version happened to
  # be committed in sdks/js/package.json and sdks/python/pyproject.toml, and the
  # README asked a human to remember to bump them first. Release 0.5.4 was
  # tagged with those files still reading 0.5.3, so both registries rejected it
  # as a duplicate and the release shipped no SDKs at all — while `docs` and
  # `docker` succeeded, so it looked like a normal release. Deriving the version
  # here makes the tag and the artifact incapable of disagreeing.
  #
  # The tag also names the *channel*, which decides which moving pointers move.
  # That used to be `github.event.release.prerelease` — a checkbox a human ticks,
  # which can disagree with the tag, and which is absent entirely on the two
  # non-release triggers. Worse, an absent `prerelease` compares equal to `false`
  # in a GitHub expression, so a tag push would have read as a *stable* release
  # and deployed the docs. One classifier, derived from the same string as the
  # version, removes the whole class.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      python_version: ${{ steps.resolve.outputs.python_version }}
      channel: ${{ steps.resolve.outputs.channel }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      sha: ${{ steps.resolve.outputs.sha }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:

      # fetch-depth: 0 is load-bearing twice over: the ancestry guard below needs
      # origin/dev and origin/main, and the alpha serial is a count of existing
      # tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The experimental channel is origin/dev plus every open, non-draft,
      # same-repo PR against dev, merged in PR-number order. Cut by hand
      # (`gh workflow run release.yml -f channel=experimental`): the question it
      # answers is "does my thing work with everything else in flight", and the
      # developer asking it decides when to ask. An automatic build per push
      # was tried first and produced a registry version per docs commit.
      #
      # It fails closed. A PR that does not merge cleanly onto dev plus the PRs
      # numbered before it stops the build; nothing is published, and that PR
      # gets a comment naming what it collided with. The older PR wins and the
      # newer one rebases, which is the rule the feature -> dev flow already has.
      #
      # Three CI rules, checked before anything is merged, each on the newest
      # CI run for the exact commit:
      #   - dev must be green, or there is no build at all;
      #   - a PR that is not green is left out of the tree. The omission is a
      #     warning annotation on the run and a line in the manifest, so the
      #     dispatcher whose own PR was red does not read a green build as
      #     "mine works with everything". It is back next time it is green.
      # "Green" means completed with success. Pending is waited for, so a
      # dispatch straight after a push sits for one CI duration.
      #
      # The set is a snapshot. dev and every PR head are read once, up front,
      # and those exact commits are what gets waited for and merged. A push
      # that lands during the wait is not pulled in — dispatch again — so the
      # manifest describes one moment, and the wait is bounded by one CI
      # duration because every run waited for started at or before the dispatch.
      #
      # The result is tagged and pushed like an alpha build, so a report against
      # "experimental.42" names an exact tree even after the PR branches are
      # deleted. The tag message carries the manifest: dev's commit, every PR
      # head that went in, and every PR that was left out and why.
      - name: Assemble the experimental tree
        id: experimental
        if: github.event_name == 'workflow_dispatch' && inputs.channel == 'experimental'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BASE="$(git tag -l '*-pre.*' --sort=-v:refname | head -n1 | sed 's/-pre\..*//')"
          if [ -z "${BASE}" ]; then
            echo "::error::Could not derive a base version from the newest -pre tag."
            exit 1
          fi

          git fetch --quiet origin "+refs/heads/dev:refs/remotes/origin/dev"
          DEV_SHA="$(git rev-parse origin/dev)"
          git checkout --quiet --detach "${DEV_SHA}"

          # Snapshot the PR heads now, before any waiting. Drafts are out: a
          # draft is its author saying "not yet", and the channel should not be
          # held up by work nobody claims is ready. Fork PRs are out because
          # this job publishes with write credentials.
          gh pr list --base dev --state open --limit 100 \
            --json number,title,headRefOid,isDraft,isCrossRepository \
            --jq 'sort_by(.number)[] | select((.isDraft or .isCrossRepository) | not) | "\(.number)\t\(.headRefOid)\t\(.title)"' \
            > prs.tsv

          # Conclusion of the newest CI run for one commit: success, failure,
          # cancelled, ..., "none" if CI never picked the commit up, or
          # "timeout". Blocks while the run is queued or in progress. Matching
          # on the CI workflow by commit is what keeps this from waiting on
          # itself — Release is also a check on the PR.
          ci_conclusion() {
            local SHA="$1" START NOW RUN
            START="$(date +%s)"
            while :; do
              RUN="$(gh run list --workflow ci.yml --commit "${SHA}" --limit 1 \
                       --json status,conclusion --jq '.[0] // empty | "\(.status) \(.conclusion)"')"
              NOW="$(date +%s)"
              case "${RUN}" in
                "completed "*) echo "${RUN#completed }"; return ;;
                # A run takes a few seconds to appear after a push; after that
                # a commit with no CI run is a commit CI will never vouch for.
                "")            if [ $(( NOW - START )) -gt 180 ]; then echo none; return; fi ;;
              esac
              if [ $(( NOW - START )) -gt 1800 ]; then echo timeout; return; fi
              sleep 30
            done
          }

          echo "Waiting for CI on dev ${DEV_SHA}"
          DEV_CI="$(ci_conclusion "${DEV_SHA}")"
          if [ "${DEV_CI}" != "success" ]; then
            echo "::error::CI on dev ${DEV_SHA} concluded '${DEV_CI}', not success. No experimental build."
            exit 1
          fi

          ONTO="dev (${DEV_SHA})"
          MANIFEST="dev ${DEV_SHA}"
          SKIPPED=""
          while IFS=$'\t' read -r NUMBER PR_SHA TITLE; do
            # The snapshot commit, not whatever the PR points at by now. After
            # a force-push the old head is normally still fetchable by SHA; if
            # it is not, fail closed — dispatch again.
            git fetch --quiet origin "refs/pull/${NUMBER}/head"
            if ! git cat-file -e "${PR_SHA}^{commit}" 2>/dev/null; then
              git fetch --quiet origin "${PR_SHA}" || {
                echo "::error::PR #${NUMBER} head ${PR_SHA} from the snapshot is no longer fetchable. Nothing published; dispatch again."
                exit 1
              }
            fi
            PR_CI="$(ci_conclusion "${PR_SHA}")"
            if [ "${PR_CI}" != "success" ]; then
              echo "::warning::PR #${NUMBER} (${PR_SHA}) left out of this experimental build: CI concluded '${PR_CI}', not success."
              SKIPPED+=$'\n'"skipped #${NUMBER} ${PR_SHA} ci=${PR_CI} ${TITLE}"
              continue
            fi
            if ! git merge --quiet --no-ff --no-edit -m "experimental: merge PR #${NUMBER} at ${PR_SHA}" "${PR_SHA}"; then
              CONFLICTS="$(git diff --name-only --diff-filter=U)"
              git merge --abort
              # One comment per (dev, PR head) pair. A push to either side is
              # a new pair, so a still-unresolved conflict is reported again
              # exactly once, not on every dispatch in between.
              MARKER="<!-- keelson-experimental-conflict ${DEV_SHA} ${PR_SHA} -->"
              if ! gh api "repos/${GITHUB_REPOSITORY}/issues/${NUMBER}/comments" --paginate --jq '.[].body' | grep -qF "${MARKER}"; then
                gh pr comment "${NUMBER}" --body "$(cat <<EOF
          ${MARKER}
          **Experimental build not published.** This PR at ${PR_SHA} does not merge cleanly onto ${ONTO}.

          Conflicting files:
          \`\`\`
          ${CONFLICTS}
          \`\`\`

          The experimental channel merges open PRs in number order, so the older PR wins: rebase this branch onto \`dev\` and resolve the conflict here. Nothing is published until every open PR applies cleanly.
          EOF
          )"
              fi
              echo "::error::PR #${NUMBER} (${PR_SHA}) does not merge cleanly onto ${ONTO}. Nothing published."
              exit 1
            fi
            ONTO+=" + #${NUMBER}"
            MANIFEST+=$'\n'"#${NUMBER} ${PR_SHA} ${TITLE}"
          done < prs.tsv
          rm -f prs.tsv
          MANIFEST+="${SKIPPED}"

          # Same content, same build. A push that changes nothing in the merged
          # tree (a draft, a rebase with no diff, dev moving by a PR that was
          # already in the set) is not a new experimental version.
          LAST_SERIAL="$(git tag -l "${BASE}-experimental.*" | sed 's/.*\.//' | sort -n | tail -n1)"
          if [ -n "${LAST_SERIAL}" ]; then
            LAST="${BASE}-experimental.${LAST_SERIAL}"
            if [ "$(git rev-parse "${LAST}^{tree}")" = "$(git rev-parse "HEAD^{tree}")" ]; then
              echo "Merged tree is identical to ${LAST}; nothing new to publish."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          SERIAL=$(( ${LAST_SERIAL:-0} + 1 ))
          TAG="${BASE}-experimental.${SERIAL}"

          # --cleanup=verbatim: the default strips lines that start with '#'
          # as comments, and every PR line in the manifest starts with '#275'.
          git tag -a --cleanup=verbatim "${TAG}" HEAD -m "$(printf 'Experimental build %s\n\n%s\n' "${SERIAL}" "${MANIFEST}")"
          # GITHUB_TOKEN-pushed, so it does not re-trigger this workflow. The
          # publish happens in this run.
          git push --quiet origin "refs/tags/${TAG}"

          echo "Assembled ${TAG}:"
          echo "${MANIFEST}"
          {
            echo "tag=${TAG}"
            # PEP 440 has no room for the word "experimental" (that is why the
            # alpha channel is numbered rather than named), so the Python spelling
            # is fixed here once: 0.6.0-experimental.42 -> 0.6.0.dev42. A .dev
            # release sorts below every alpha and rc, so pip never picks it
            # without an exact pin.
            echo "python_version=${BASE}.dev${SERIAL}"
            echo "skip=false"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Experimental build \`${TAG}\`"
            echo
            echo '```'
            echo "${MANIFEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve version, channel and commit
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "${{ steps.experimental.outputs.skip }}" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "${{ steps.experimental.outputs.tag }}" ]; then
            TAG="${{ steps.experimental.outputs.tag }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # channel=alpha (experimental was handled above and set `tag`).
            # Alpha builds are addressed by PR number, not by branch name.
            # A branch is mutable — `feature/checklist-subjects` named four
            # different trees in one week — while a PR number is permanent and
            # is also what identifies the keelson half of a cross-repo feature.
            PR="${{ inputs.pr }}"
            if ! [[ "${PR}" =~ ^[0-9]+$ ]]; then
              echo "::error::an alpha build needs a PR number in the pr input, got '${PR}'"
              exit 1
            fi
            SHA="$(gh pr view "${PR}" --json headRefOid --jq .headRefOid)"

            BASE="${{ inputs.base_version }}"
            if [ -z "${BASE}" ]; then
              BASE="$(git tag -l '*-pre.*' --sort=-v:refname | head -n1 | sed 's/-pre\..*//')"
            fi
            if [ -z "${BASE}" ]; then
              echo "::error::Could not derive a base version; pass base_version."
              exit 1
            fi

            # Serial counts the alpha tags already cut for this PR, so nobody has
            # to remember where they got to. Note a force-push means dev.3 and
            # dev.4 can be unrelated trees — which is why the commit is recorded
            # in the tag message below.
            SERIAL=$(( $(git tag -l "${BASE}-alpha.${PR}.dev.*" | wc -l) + 1 ))
            TAG="${BASE}-alpha.${PR}.dev.${SERIAL}"

            git tag -a "${TAG}" "${SHA}" -m "Alpha build ${SERIAL} for PR #${PR} at ${SHA}"
            # Pushed with GITHUB_TOKEN, which by design does not re-trigger the
            # `push: tags` route above. The publish happens in this same run.
            git push origin "refs/tags/${TAG}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi

          VERSION="${TAG#v}"   # tolerate a v-prefix; current tags have none
          if [ -z "${VERSION}" ]; then
            echo "::error::Release tag is empty — cannot determine a version to publish."
            exit 1
          fi

          PR_NUMBER=""
          case "${VERSION}" in
            *-alpha.*.dev.*)
              CHANNEL=alpha
              PR_NUMBER="${VERSION#*-alpha.}"
              PR_NUMBER="${PR_NUMBER%%.dev.*}"
              if ! [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
                echo "::error::'${VERSION}' does not carry a numeric PR number."
                exit 1
              fi
              ;;
            *-pre.*|*-rc.*)
              CHANNEL=integration
              ;;
            *-experimental.*)
              CHANNEL=experimental
              ;;
            *-*)
              echo "::error::Tag '${TAG}' matches no known channel. Use X.Y.Z, X.Y.Z-pre.N, X.Y.Z-alpha.<pr>.dev.<n>, or X.Y.Z-experimental.<n>."
              exit 1
              ;;
            *)
              CHANNEL=stable
              ;;
          esac

          # Every other channel's spelling is valid PEP 440 as-is and uv
          # normalises it; experimental is the one that needs a translation.
          PYTHON_VERSION="${{ steps.experimental.outputs.python_version }}"
          PYTHON_VERSION="${PYTHON_VERSION:-${VERSION}}"

          SHA="$(git rev-parse "refs/tags/${TAG}^{commit}")"

          echo "Publishing ${VERSION} on the ${CHANNEL} channel (commit ${SHA})"
          {
            echo "version=${VERSION}"
            echo "python_version=${PYTHON_VERSION}"
            echo "channel=${CHANNEL}"
            echo "pr_number=${PR_NUMBER}"
            echo "sha=${SHA}"
            echo "skip=false"
          } >> "$GITHUB_OUTPUT"

      # What a channel means, enforced rather than asked for. Between
      # 0.6.0-pre.5 and 0.6.0-pre.12, seven of twelve prereleases were cut from
      # unmerged feature branches; npm's `next` gained and lost the checklist
      # payloads four times, so a consumer following the integration line saw
      # protocol types appear, vanish and reappear. The convention existed and
      # was even written down — it just had nothing enforcing it, and was
      # violated within a day of being documented.
      #
      # `target_commitish` cannot do this job: 0.6.0-pre.6 recorded a bare SHA,
      # so it does not reliably name a branch. Ancestry is the real question.
      - name: Verify the commit belongs on this channel
        if: steps.resolve.outputs.skip != 'true'
        run: |
          set -euo pipefail
          CHANNEL="${{ steps.resolve.outputs.channel }}"
          SHA="${{ steps.resolve.outputs.sha }}"

          git fetch --quiet origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/dev:refs/remotes/origin/dev"

          case "${CHANNEL}" in
            alpha)
              # Unmerged by definition — that is the entire point of the channel.
              echo "alpha build: no ancestry requirement"
              exit 0
              ;;
            experimental)
              # The relation is the other way round: the build must contain dev,
              # never be a subset of it.
              if ! git merge-base --is-ancestor origin/dev "${SHA}"; then
                echo "::error::experimental build ${SHA} does not contain origin/dev."
                exit 1
              fi
              echo "origin/dev is an ancestor of ${SHA}"
              exit 0
              ;;
            integration) REQUIRED=origin/dev ;;
            stable)      REQUIRED=origin/main ;;
          esac

          if ! git merge-base --is-ancestor "${SHA}" "${REQUIRED}"; then
            echo "::error::${SHA} is not an ancestor of ${REQUIRED}. A ${CHANNEL} release must be cut from ${REQUIRED#origin/}. To publish work that is still on a PR branch, run this workflow from the Actions tab with the PR number — that produces an alpha build, which does not move \`next\` or \`latest\`."
            exit 1
          fi
          echo "${SHA} is an ancestor of ${REQUIRED}"

  # An experimental tree has never been tested as a whole: CI ran on each PR
  # alone. Run the unit suites on the merge before publishing it, so the
  # channel means "everything in flight, and it at least passes its tests"
  # rather than "may not even import". Fails closed like a conflict does.
  experimental-gate:
    needs: version
    if: needs.version.outputs.channel == 'experimental' && needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Sync workspace with all packages
        run: uv sync --all-packages --group dev

      - name: Generate SDK code
        run: cd sdks/python && ./generate_python.sh

      - name: Python unit tests (SDK + connectors)
        run: uv run pytest -m "not e2e" sdks/python/tests/ connectors/

      - name: JavaScript SDK tests
        run: |
          cd sdks/js
          npm ci
          ./generate_javascript.sh
          npm run test

  python-sdk:
    needs: [version, experimental-gate]
    # Skipped when the version job reported an unchanged experimental tree and
    # when the experimental gate failed. `!cancelled()` is what lets a job run
    # behind a *skipped* dependency at all.
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.version.outputs.skip != 'true' && (needs.experimental-gate.result == 'success' || needs.experimental-gate.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.python_version }}
    steps:

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: astral-sh/setup-uv@v7

      # `--frozen` matters: plain `uv version` writes the file and then tries to
      # re-lock and sync, which exits non-zero here and would fail the job even
      # though the version was set correctly.
      #
      # Every channel's spelling is valid PEP 440 as-is: `0.6.0-pre.12` and
      # `0.6.0-alpha.202.dev.3` normalise to `0.6.0rc12` and `0.6.0a202.dev3`.
      # That is why the alpha channel is numbered by PR rather than named after
      # a branch — PEP 440 has no room for a word like `checklist`, and a scheme
      # PyPI rejects is a scheme where the three registries stop agreeing.
      - name: Set version from release tag
        run: cd sdks/python && uv version --frozen "${VERSION}"

      # Read the version back rather than reusing $VERSION, because PEP 440
      # normalises it: a tag of 0.5.9-rc.2 becomes 0.5.9rc2 here while npm keeps
      # the semver spelling. Guarding on the un-normalised string would miss an
      # already-published prerelease.
      - name: Refuse to republish an existing version
        run: |
          PKG_VERSION="$(cd sdks/python && uv version --short)"
          echo "PyPI version: ${PKG_VERSION}"
          if curl -fsSL -o /dev/null "https://pypi.org/pypi/keelson/${PKG_VERSION}/json"; then
            echo "::error::keelson ${PKG_VERSION} is already on PyPI. Tag a new version."
            exit 1
          fi

      - name: Sync workspace
        run: uv sync --group dev

      - name: Generate SDK code
        run: cd sdks/python && ./generate_python.sh

      - name: Build package
        run: |
          cd sdks/python && uv build --wheel --out-dir dist

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist/

  javascript-sdk:
    needs: [version, experimental-gate]
    # Skipped when the version job reported an unchanged experimental tree and
    # when the experimental gate failed. `!cancelled()` is what lets a job run
    # behind a *skipped* dependency at all.
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.version.outputs.skip != 'true' && (needs.experimental-gate.result == 'success' || needs.experimental-gate.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CHANNEL: ${{ needs.version.outputs.channel }}
      PR_NUMBER: ${{ needs.version.outputs.pr_number }}
    steps:

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      # The Node version is load-bearing, not cosmetic. @rise-maritime/keelson-js
      # publishes through an npm *trusted publisher* (OIDC) rather than a token,
      # and OIDC support landed in npm 11.5.1. Node 24 bundles npm 11.17; Node 22
      # bundles 10.9, which has no OIDC at all and silently falls back to token
      # auth — the registry then answers a bare `404 PUT`, which is how
      # 0.6.0-pre.2 died. Do not drop below Node 24, and do not "fix" this by
      # re-adding `npm install -g npm@latest` — that is how 0.6.0-pre.1 died.
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - uses: astral-sh/setup-uv@v7

      # Fail in two seconds with a readable message instead of six minutes later
      # with a 404 that names neither npm nor auth as the cause.
      - name: Verify npm supports trusted publishing
        run: |
          set -euo pipefail
          MINIMUM=11.5.1
          NPM_VERSION="$(npm --version)"
          echo "npm ${NPM_VERSION}"
          if [ "$(printf '%s\n%s\n' "${MINIMUM}" "${NPM_VERSION}" | sort -V | head -n1)" != "${MINIMUM}" ]; then
            echo "::error::npm ${NPM_VERSION} has no OIDC trusted-publishing support (need >= ${MINIMUM}). Bump node-version."
            exit 1
          fi

      # Same reasoning as the PyPI guard: this is exactly how 0.5.4 failed, and
      # `npm publish` only says so as its final act.
      - name: Refuse to republish an existing version
        run: |
          if npm view "@rise-maritime/keelson-js@${VERSION}" version >/dev/null 2>&1; then
            echo "::error::@rise-maritime/keelson-js ${VERSION} is already on npm. Tag a new version."
            exit 1
          fi

      - name: Sync for protoc
        run: uv sync --group dev

      - name: Install JS dependencies
        run: cd sdks/js && npm ci

      - name: Set version from release tag
        run: cd sdks/js && npm version --no-git-tag-version --allow-same-version "${VERSION}"

      - name: Generate code
        run: cd sdks/js && ./generate_javascript.sh

      # No NODE_AUTH_TOKEN: authentication is the OIDC trusted publisher declared
      # on the package at npmjs.com, which is what `permissions: id-token: write`
      # at the top of this file is for. A token here would only paper over an
      # OIDC regression until it too went stale.
      #
      # Which dist-tag moves is the whole point of the channel. An alpha gets its
      # own `pr-<n>` pointer and touches neither `next` nor `latest`, so a build
      # of one PR can never regress the integration line for everyone else.
      - name: Publish package
        run: |
          set -euo pipefail
          cd sdks/js
          npm run compile
          npm pack
          case "${CHANNEL}" in
            alpha)        npm publish --provenance --access public --tag "pr-${PR_NUMBER}" ;;
            experimental) npm publish --provenance --access public --tag experimental ;;
            integration)  npm publish --provenance --access public --tag next ;;
            stable)       npm publish --provenance --access public ;;
          esac

  docker:
    needs: [version, experimental-gate]
    # Skipped when the version job reported an unchanged experimental tree and
    # when the experimental gate failed. `!cancelled()` is what lets a job run
    # behind a *skipped* dependency at all.
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.version.outputs.skip != 'true' && (needs.experimental-gate.result == 'success' || needs.experimental-gate.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PYTHON_VERSION: ${{ needs.version.outputs.python_version }}
      CHANNEL: ${{ needs.version.outputs.channel }}
      PR_NUMBER: ${{ needs.version.outputs.pr_number }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      -
        uses: astral-sh/setup-uv@v7
      -
        name: Sync for protoc
        run: uv sync --group dev
      -
        # The image `pip install`s sdks/python, so without this a :0.5.5 image
        # reports keelson 0.5.3 from inside. Same lie, different artifact.
        # PYTHON_VERSION differs from VERSION only on the experimental channel
        # (0.6.0-experimental.42 -> 0.6.0.dev42, see the version job).
        name: Set version from release tag
        run: cd sdks/python && uv version --frozen "${PYTHON_VERSION}"
      -
        name: Generate SDK code
        run: cd sdks/python && ./generate_python.sh
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Compute image tags
        id: image_tags
        run: |
          set -euo pipefail
          # The version tag is always pushed — deployments pin to it. The moving
          # pointers are per channel: `:latest` only for a stable release, and an
          # alpha gets `:pr-<n>` so cross-repo work can follow one PR's head
          # without pinning a new digest on every build.
          {
            echo "tags<<EOF"
            echo "ghcr.io/rise-maritime/keelson:${VERSION}"
            case "${CHANNEL}" in
              alpha)        echo "ghcr.io/rise-maritime/keelson:pr-${PR_NUMBER}" ;;
              experimental) echo "ghcr.io/rise-maritime/keelson:experimental" ;;
              stable)       echo "ghcr.io/rise-maritime/keelson:latest" ;;
            esac
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      -
        name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image_tags.outputs.tags }}
      -
        name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

  docs:
    # The published docs site tracks stable releases only. Anything else would
    # gh-deploy --force unreviewed protocol docs over the public site.
    if: needs.version.outputs.channel == 'stable'

    needs: version

    permissions:
      contents: write

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]

      - uses: astral-sh/setup-uv@v7

      - name: Cache
        uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ github.run_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      - name: Install docs tools
        run: |
          sudo wget -O /usr/bin/protodot https://protodot.seamia.net/binaries/linux && sudo chmod +x /usr/bin/protodot
          sudo apt-get update && sudo apt-get -y install graphviz

      - name: Sync workspace
        run: uv sync --group dev --group docs

      - name: Generate SDK and docs
        run: |
          cd sdks/python && ./generate_python.sh
          cd ../..
          chmod +x generate_docs.sh && ./generate_docs.sh

      - name: Deploy docs
        env:
          DISABLE_MKDOCS_2_WARNING: "true"
        run: uv run mkdocs gh-deploy --force --strict
